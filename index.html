    <style>
        :root {
            --theme-primary: #2563eb;

        /* MOBILE FIX: Ensure the body handles dynamic browser bars gracefully */
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif;

        /* FIXED: Only hide empty portfolio data fields, not login inputs! */
        body:not(.edit-mode) textarea[data-field]:placeholder-shown,
        body:not(.edit-mode) input[data-field]:placeholder-shown,
        body:not(.edit-mode) .hide-if-empty:empty,
        body:not(.edit-mode) .hide-if-no-media:not(:has(img)):not(:has(iframe)) { display: none !important; }

        body.edit-mode .edit-mode-hidden-item { opacity: 0.6; filter: grayscale(40%); border: 1px dashed #cbd5e1; }

        /* Media Protection */
        .protected-media { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-user-drag: none; pointer-events: auto; }

        #app-sidebar { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        #app-sidebar.collapsed { width: 5.5rem; }
        #app-sidebar.collapsed .hide-on-collapse { display: none; opacity: 0; }
        #app-sidebar.collapsed .center-on-collapse { justify-content: center; padding-left: 0; padding-right: 0; }
        
        /* Smooth re-centering of toggle button when sidebar collapses */
        #app-sidebar.collapsed #sidebar-toggle-btn { right: 50%; transform: translateX(50%); top: calc(1rem + env(safe-area-inset-top)); }
        #app-sidebar:not(.collapsed) #sidebar-toggle-btn { transform: translateX(0); }
        #app-sidebar.collapsed .profile-pic-container { margin-top: 2.5rem; }
        #app-sidebar:not(.collapsed) .profile-pic-container { margin-top: 0; }
        
        /* Square active block styling for collapsed state */
        #app-sidebar.collapsed .menu-item { justify-content: center !important; padding: 0.75rem !important; aspect-ratio: 1/1 !important; display: flex !important; flex-direction: column !important; align-items: center !important; }
        #app-sidebar.collapsed .menu-item .icon-container { width: 100% !important; height: 100% !important; display: flex !important; align-items: center !important; justify-content: center !important; margin: 0 !important; background: transparent !important; box-shadow: none !important; }
        #app-sidebar.collapsed .menu-item .icon-container i { font-size: 1.25rem !important; }

        @media (max-width: 767px) {
            #app-sidebar { position: absolute; left: 0; top: 0; transform: translateX(-100%); width: 85vw !important; max-width: 320px; z-index: 50; height: 100%; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
            #app-sidebar.mobile-open { transform: translateX(0); }
            #app-sidebar .hide-on-collapse { display: block; opacity: 1; }
            #app-sidebar.collapsed { width: 85vw !important; }
            .mobile-overlay { display: none; position: fixed; inset: 0; background: rgba(15,23,42,0.4); z-index: 40; backdrop-filter: blur(3px); }
            .mobile-overlay.show { display: block; }
        }

        #toast-notification { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s; transform: translateY(100px); opacity: 0; z-index: 99999; }
        #toast-notification.show { transform: translateY(0); opacity: 1; }

        .fade-in { animation: fadeIn 0.4s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .wave-emoji { display: inline-block; animation: wave 2.5s infinite; transform-origin: 70% 70%; }
        @keyframes wave { 0% { transform: rotate( 0.0deg) } 10% { transform: rotate(14.0deg) } 20% { transform: rotate(-8.0deg) } 30% { transform: rotate(14.0deg) } 40% { transform: rotate(-4.0deg) } 50% { transform: rotate(10.0deg) } 60% { transform: rotate( 0.0deg) } 100% { transform: rotate( 0.0deg) } }

</head>

        async function loadFromFirebase() {
            try {
                const docRef = db.collection('portfolioData').doc(DOC_ID);
                const docSnap = await docRef.get();
                if (docSnap.exists) {
                    let dbData = docSnap.data();
                    delete dbData.currentView;
                    delete dbData.activeIds;
                    delete dbData.isEditMode;
                    delete dbData.isSidebarCollapsed;
                    delete dbData.modalContext;
                    delete dbData.modalIndex;

                    if (!dbData.sections) {
                        dbData.sections = [
                            { id: 'sec_acad', title: 'Academics', isAcademic: true, isVisible: true },
                            { id: 'sec_beyond', title: 'Beyond Academics', isAcademic: false, categories: ['extracurriculars', 'hobbies', 'achievements', 'photoFeed'], isVisible: true }
                        ];
                    }
                    if (!dbData.categoryVisibility) dbData.categoryVisibility = {};
                    if (!dbData.contact) {
                        dbData.contact = state.contact;
                    } else {
                        if (!dbData.contact.details || dbData.contact.details.length <= 5) {
                            dbData.contact.details = state.contact.details;
                        }
                        if (!dbData.contact.socials || dbData.contact.socials.length <= 5) {
                            dbData.contact.socials = state.contact.socials;
                        }
                    }
                    if (!dbData.customIcons) dbData.customIcons = {};
                    
                    state = { ...state, ...dbData };
                }
            } catch (e) {
                console.warn("Using default pre-filled state:", e);
            } finally {
                // Ensure initial menu state is clean (Main expanded, Subs collapsed)
                state.collapsedMenus.sections = {};
                state.collapsedMenus.classes = {};
                state.collapsedMenus.categories = {};
                
                state.sections.forEach(sec => state.collapsedMenus.sections[sec.id] = false); // Expand Main
                state.classes.forEach(cls => state.collapsedMenus.classes[cls.id] = true); // Collapse Grades
                state.sections.forEach(sec => {
                    if (sec.categories) sec.categories.forEach(cat => state.collapsedMenus.categories[cat] = true); // Collapse Hobbies
                });
                
                state.currentView = 'about';
                applyTheme(state.theme || 'blue');
                renderApp();
                hideLoader();
            }
        }

        function askUser(options) {
            const modal = document.getElementById('action-modal');
            const panel = document.getElementById('action-modal-panel');
            const title = document.getElementById('action-modal-title');
            const input1 = document.getElementById('action-modal-input-1');
            const input2 = document.getElementById('action-modal-input-2');
            const cancelBtn = document.getElementById('action-modal-cancel');
            const submitBtn = document.getElementById('action-modal-submit');
            
            title.innerText = options.title || 'Are you sure?';
            
            input1.value = ''; input2.value = '';
            input1.classList.add('hidden'); input2.classList.add('hidden');
            
            if (options.type === 'prompt') {
                input1.classList.remove('hidden');
                input1.placeholder = options.placeholder || 'Enter value...';
                input1.type = 'text';
            } else if (options.type === 'login') {
                input1.classList.remove('hidden');
                input2.classList.remove('hidden');
                input1.placeholder = 'Admin Email';
                input1.type = 'email';
                input2.placeholder = 'Admin Password';
                input2.type = 'password';
            }
            
            submitBtn.innerText = options.submitText || 'Submit';
            
            const handleEnter = (e) => { if (e.key === 'Enter') submitBtn.click(); };
            input1.addEventListener('keypress', handleEnter);
            input2.addEventListener('keypress', handleEnter);

            const cleanup = () => {
                modal.classList.add('opacity-0');
                panel.classList.remove('scale-100');
                panel.classList.add('scale-95');
                setTimeout(() => modal.classList.add('hidden'), 300);
                submitBtn.onclick = null;
                cancelBtn.onclick = null;
                input1.removeEventListener('keypress', handleEnter);
                input2.removeEventListener('keypress', handleEnter);
            };
            
            cancelBtn.onclick = cleanup;
            
            submitBtn.onclick = () => {
                let val1 = input1.value.trim();
                let val2 = input2.value.trim();
                if (options.type === 'prompt' && !val1) return;
                if (options.type === 'login' && (!val1 || !val2)) return;
                
                cleanup();
                if (options.onSubmit) options.onSubmit(val1, val2);
            };
            
            modal.classList.remove('hidden');
            void modal.offsetWidth;
            modal.classList.remove('opacity-0');
            panel.classList.remove('scale-95');
            panel.classList.add('scale-100');
            
            if (options.type === 'prompt' || options.type === 'login') {
                setTimeout(() => input1.focus(), 100);
            }
        }

        function attachInputListeners() {
            document.querySelectorAll('textarea[data-field], input[data-field]').forEach(input => {
                if(input.tagName === 'TEXTAREA') {
                    input.addEventListener('input', function() { 
                        this.style.height = 'auto';
                        this.style.height = this.scrollHeight + 'px'; 
                    });
                }
                input.addEventListener('input', (e) => {
                    if (!auth.currentUser) return;
                    const field = e.target.dataset.field;
                    const val = e.target.value;
                    const ids = e.target.dataset.ids ? e.target.dataset.ids.split(',') : [];

                    if (field.startsWith('profile.')) state.profile[field.split('.')[1]] = val;
                    else if (field.startsWith('about.')) state.about[field.split('.')[1]] = val;
                    else if (field === 'section.title') state.sections.find(s => s.id === ids[0]).title = val;
                    else if (field === 'class.name') state.classes.find(c => c.id === ids[0]).name = val;
                    else if (field === 'subject.name') state.classes.find(c => c.id === ids[0]).subjects.find(s => s.id === ids[1]).name = val;
                    else if (field === 'subject.desc') state.classes.find(c => c.id === ids[0]).subjects.find(s => s.id === ids[1]).description = val;
                    else if (field === 'project.title') state.classes.find(c => c.id === ids[0]).subjects.find(s => s.id === ids[1]).projects[ids[2]].title = val;
                    else if (field === 'project.desc') state.classes.find(c => c.id === ids[0]).subjects.find(s => s.id === ids[1]).projects[ids[2]].desc = val;
                    else if (field === 'category.name') state.categoryNames[ids[0]] = val;
                    else if (field === 'generic.title') state[ids[0]][ids[1]][ids[2]].title = val;
                    else if (field === 'generic.desc') state[ids[0]][ids[1]][ids[2]].desc = val;
                    
                    else if (field === 'contact.title') state.contact.title = val;
                    else if (field === 'contact.subtitle') state.contact.subtitle = val;
                    else if (field === 'contactDetail.label') state.contact.details[ids[0]].label = val;
                    else if (field === 'contactDetail.value') state.contact.details[ids[0]].value = val;
                    else if (field === 'contactSocial.label') state.contact.socials[ids[0]].label = val;
                    else if (field === 'contactSocial.link') state.contact.socials[ids[0]].link = val;

                    document.querySelectorAll(`[data-sync="${field}_${ids.join('_')}"]`).forEach(el => el.innerText = val);
                    triggerSave();
                });
            });
        }

        function getContactLink(value) {
            if (!value) return '';
            const cleaned = value.trim();
            if (cleaned.toLowerCase().startsWith('http://') || cleaned.toLowerCase().startsWith('https://')) return cleaned;
            if (cleaned.includes('@') && !cleaned.includes(' ')) return `mailto:${cleaned}`;
            if (/^[\+\d\s\-\(\)]+$/.test(cleaned) && cleaned.match(/\d/g)?.length >= 7) return `tel:${cleaned.replace(/[^\d\+]/g, '')}`;
            if (cleaned.toLowerCase().startsWith('www.')) return `https://${cleaned}`;
            return '';
        }

                const cls = state.classes.find(c => c.id === state.activeIds.classId);

                html += `<span class="mx-2 text-slate-300 flex-shrink-0">/</span><span class="cursor-pointer hover:text-slate-900 transition flex-shrink-0" onclick="handleBreadcrumbNavigation('section', ['sections', '${sec.id}'])">${sec.title}</span>`;
                html += `<span class="mx-2 text-slate-300 flex-shrink-0">/</span><span class="cursor-pointer hover:text-slate-900 transition flex-shrink-0" onclick="openSidebarMenu('classes', '${cls.id}')">${cls.name}</span>`;
                html += `<span class="mx-2 text-slate-300 flex-shrink-0">/</span><span class="text-slate-900 font-bold flex-shrink-0">${sub.name}</span>`;
            } else if (state.currentView === 'category') {
                const sec = state.sections.find(s => s.id === state.activeIds.sectionId) || {title: 'Beyond Academics'};
                const catName = state.categoryNames[state.activeIds.category];
                const cls = state.classes.find(c => c.id === state.activeIds.classId);
                html += `<span class="mx-2 text-slate-300 flex-shrink-0">/</span><span class="cursor-pointer hover:text-slate-900 transition flex-shrink-0" onclick="handleBreadcrumbNavigation('section', ['sections', '${sec.id}'])">${sec.title}</span>`;
                html += `<span class="mx-2 text-slate-300 flex-shrink-0">/</span><span class="cursor-pointer hover:text-slate-900 transition flex-shrink-0" onclick="openSidebarMenu('categories', '${state.activeIds.category}')">${catName}</span>`;
                html += `<span class="mx-2 text-slate-300 flex-shrink-0">/</span><span class="text-slate-900 font-bold flex-shrink-0">${cls.name}</span>`;
            } else if (state.currentView === 'contact') {
                html += `<span class="mx-2 text-slate-300 flex-shrink-0">/</span><span class="text-slate-900 font-bold flex-shrink-0">${state.contact.title}</span>`;
            } else {
                html += `<span class="mx-2 text-slate-300 flex-shrink-0">/</span><span class="text-slate-900 font-bold flex-shrink-0">About Me</span>`;
            }
            bc.innerHTML = html;
        }

        function renderSidebarNav() {
            const nav = document.getElementById('sidebar-nav');
            
            const activeStyle = 'bg-[var(--theme-primary)] text-white shadow-md font-bold';
            const inactiveStyle = 'bg-transparent text-slate-600 hover:bg-slate-100 hover:text-slate-900 font-semibold';
            const iconActiveStyle = 'text-white';
            const iconInactiveStyle = 'bg-white shadow-sm text-[var(--theme-primary)] border border-[var(--theme-border)] hover:brightness-95';

            let html = `
                <div class="menu-item mt-2 mb-1 group relative">
                    <div onclick="handleIconClick(event, () => switchView('about'))" class="flex items-center space-x-3 p-3 rounded-xl cursor-pointer transition ${state.currentView === 'about' ? activeStyle : inactiveStyle} center-on-collapse">
                        <div class="icon-container w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0 transition-colors ${state.currentView === 'about' ? iconActiveStyle : iconInactiveStyle}"><i class="fa-solid fa-user text-sm"></i></div>
                        <span class="text-sm truncate hide-on-collapse flex-1">About Me</span>
                    </div>
                </div>
            `;

            state.sections.forEach(sec => {
                const isVisible = sec.isVisible !== false;
                if (!isVisible && !state.isEditMode) return;
                
                const hiddenClass = !isVisible ? 'opacity-50 grayscale' : '';
                const isSecCollapsed = !!state.collapsedMenus['sections'][sec.id];
                const isActiveMain = state.currentView === 'section' && state.activeIds.sectionId === sec.id;
                const secIcon = sec.isAcademic ? 'fa-graduation-cap' : 'fa-star';
                const displayIcon = getIconClass(state.customIcons?.[sec.id] || secIcon, 'fa-solid');
                
                html += `
                    <div class="menu-item mt-3 mb-1 group relative ${hiddenClass}">
                        <div class="flex items-center justify-between p-3 rounded-xl cursor-pointer transition ${isActiveMain ? activeStyle : inactiveStyle} center-on-collapse" onclick="handleIconClick(event, () => switchView('section', '${sec.id}'))">
                            <div class="flex items-center space-x-3 min-w-0 flex-1">
                                <div class="icon-container w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0 transition-colors relative ${isActiveMain ? iconActiveStyle : iconInactiveStyle} ${state.isEditMode ? 'cursor-pointer hover:ring-2 hover:ring-[var(--theme-border)]' : ''}" ${state.isEditMode ? `onclick="event.stopPropagation(); openIconPicker('section', '${sec.id}')"` : ''} title="${state.isEditMode ? 'Change Icon' : ''}">
                                    <i class="${displayIcon} text-sm"></i>
                                    ${state.isEditMode ? `<div class="absolute -top-1.5 -right-1.5 bg-white text-[var(--theme-primary)] rounded-full w-4 h-4 flex items-center justify-center text-[8px] shadow border border-slate-100"><i class="fa-solid fa-pen"></i></div>` : ''}
                                </div>
                                <textarea rows="1" data-field="section.title" data-ids="${sec.id}" class="w-full text-sm font-semibold bg-transparent editable-border p-0 resize-none overflow-hidden cursor-pointer truncate hide-on-collapse" onclick="event.stopPropagation()">${sec.title}</textarea>
                            </div>
                            <div class="flex items-center space-x-1 p-1 hide-on-collapse" onclick="handleIconClick(event, () => toggleMenuSection('sections', '${sec.id}'))">
                                <i class="fa-solid fa-chevron-${isSecCollapsed ? 'down' : 'up'} text-[10px] ${isActiveMain ? 'text-white/80' : 'text-slate-400'} transition"></i>
                                <button onclick="toggleSectionVisibility(event, '${sec.id}')" class="edit-controls-flex text-slate-400 hover:text-slate-600 p-1" title="Toggle Visibility"><i class="fa-solid ${isVisible ? 'fa-eye' : 'fa-eye-slash'} text-[10px]"></i></button>
                                <button onclick="removeSection(event, '${sec.id}')" class="edit-controls-flex text-rose-400 hover:text-rose-600 p-1" title="Delete Section"><i class="fa-solid fa-times text-[10px]"></i></button>
                            </div>
                        </div>
                        
                        <div class="tree-line mt-2 ${isSecCollapsed ? 'hidden' : 'block'} hide-on-collapse">
                `;

                if (sec.isAcademic) {
                    state.classes.forEach((cls) => {
                        const isVisibleCls = cls.isVisible !== false;
                        if (!isVisibleCls && !state.isEditMode) return;
                        
                        const hiddenClassCls = !isVisibleCls ? 'opacity-50 grayscale' : '';
                        const isClsCollapsed = state.collapsedMenus['classes'][cls.id] !== false;
                        
                        html += `
                            <div class="tree-item min-w-0 mb-1 ${hiddenClassCls}">
                                <div class="flex items-center justify-between py-1.5 pl-6 pr-2 cursor-pointer group hover:bg-slate-50 rounded-lg transition" onclick="handleIconClick(event, () => toggleMenuSection('classes', '${cls.id}'))">
                                    <div class="flex items-center space-x-2 w-full min-w-0">
                                        <div class="w-1.5 h-1.5 rounded-full bg-slate-300"></div>
                                        <textarea rows="1" data-field="class.name" data-ids="${cls.id}" class="w-full text-xs font-bold text-slate-700 bg-transparent editable-border p-0.5 resize-none overflow-hidden" onclick="event.stopPropagation()">${cls.name}</textarea>
                                    </div>
                                    <div class="flex items-center space-x-1">
                                        <i class="fa-solid fa-chevron-${isClsCollapsed ? 'down' : 'up'} text-[8px] text-slate-400 transition"></i>
                                        <button onclick="toggleClassVisibility(event, '${cls.id}')" class="edit-controls-flex text-slate-400 hover:text-slate-600 p-1" title="Toggle Visibility"><i class="fa-solid ${isVisibleCls ? 'fa-eye' : 'fa-eye-slash'} text-[10px]"></i></button>
                                        <button onclick="removeClass(event, '${cls.id}')" class="edit-controls-flex text-rose-400 hover:text-rose-600 p-1" title="Delete Class"><i class="fa-solid fa-times text-[10px]"></i></button>
                                    </div>
                                </div>
                                <div class="space-y-0.5 mt-0.5 ${isClsCollapsed ? 'hidden' : 'block'} pl-8 border-l-2 border-slate-100 ml-7">
                        `;
                        cls.subjects.forEach(sub => {
                            const isActive = state.activeIds.subjectId === sub.id;
                            html += `
                                <div onclick="switchView('subject', '${sec.id}', '${cls.id}', '${sub.id}')" class="flex items-center justify-between py-1.5 px-2 rounded-lg cursor-pointer transition ${isActive ? 'font-bold' : 'text-slate-500 hover:text-slate-800'} min-w-0" ${isActive ? 'style="background-color: var(--theme-light); color: var(--theme-primary);"' : ''}>
                                    <div class="flex items-center space-x-2 min-w-0">
                                        <i class="fa-solid fa-book-open text-[9px] text-slate-300 flex-shrink-0"></i>
                                        <span class="text-xs truncate min-w-0" data-sync="subject.name_${cls.id}_${sub.id}">${sub.name}</span>
                                    </div>
                                    <button onclick="removeSubject(event, '${cls.id}', '${sub.id}')" class="edit-controls-flex text-rose-400 hover:text-rose-600 p-1" title="Delete Subject"><i class="fa-solid fa-times text-[9px]"></i></button>
                                </div>
                            `;
                        });
                        html += `
                            <button onclick="addSubject('${cls.id}')" class="edit-controls-flex items-center space-x-2 text-[10px] font-bold py-1.5 px-2" style="color: var(--theme-primary);">
                                <i class="fa-solid fa-plus"></i><span>Add Subject</span>
                            </button>
                        </div></div>`;
                    });
                    html += `<button onclick="addClass()" class="edit-controls-flex w-full items-center pl-6 py-2 space-x-2 text-[10px] font-bold text-emerald-600 hover:text-emerald-700 transition"><i class="fa-solid fa-plus"></i><span>Add Grade / Class</span></button>`;
                } 
                else {
                    (sec.categories || []).forEach(cat => {
                        const isVisibleCat = state.categoryVisibility && state.categoryVisibility[cat] !== false;
                        if (!isVisibleCat && !state.isEditMode) return;
                        
                        const hiddenClassCat = !isVisibleCat ? 'opacity-50 grayscale' : '';
                        
                        const icon = cat === 'photoFeed' ? 'fa-images' : (cat === 'achievements' ? 'fa-trophy' : (cat === 'hobbies' ? 'fa-palette' : 'fa-medal'));
                        const iconColor = cat === 'photoFeed' ? 'text-pink-500' : (cat === 'achievements' ? 'text-amber-500' : (cat === 'hobbies' ? 'text-purple-500' : 'text-emerald-500'));
                        const displayIconCat = getIconClass(state.customIcons?.[cat] || icon, 'fa-solid');
                        const isCatCollapsed = state.collapsedMenus['categories'][cat] !== false;
                        
                        html += `
                            <div class="tree-item min-w-0 mb-1 ${hiddenClassCat}">
                                <div class="flex items-center justify-between py-1.5 pl-6 pr-2 cursor-pointer group hover:bg-slate-50 rounded-lg transition" onclick="handleIconClick(event, () => toggleMenuSection('categories', '${cat}'))">
                                    <div class="flex items-center space-x-2 w-full min-w-0">
                                        <i class="${displayIconCat} text-[10px] ${iconColor} ${state.isEditMode ? 'cursor-pointer hover:scale-125 transition' : ''}" title="${state.isEditMode ? 'Change Icon' : ''}" ${state.isEditMode ? `onclick="event.stopPropagation(); openIconPicker('category', '${cat}')"` : ''}></i>
                                        <textarea rows="1" data-field="category.name" data-ids="${cat}" class="w-full text-xs font-bold text-slate-700 bg-transparent editable-border p-0.5 resize-none overflow-hidden" onclick="event.stopPropagation()">${state.categoryNames[cat] || cat}</textarea>
                                    </div>
                                    <div class="flex items-center space-x-1">
                                        <i class="fa-solid fa-chevron-${isCatCollapsed ? 'down' : 'up'} text-[8px] text-slate-400 transition"></i>
                                        <button onclick="toggleCategoryVisibility(event, '${cat}')" class="edit-controls-flex text-slate-400 hover:text-slate-600 p-1" title="Toggle Visibility"><i class="fa-solid ${isVisibleCat ? 'fa-eye' : 'fa-eye-slash'} text-[10px]"></i></button>
                                        <button onclick="removeCategory(event, '${sec.id}', '${cat}')" class="edit-controls-flex text-rose-400 hover:text-rose-600 p-1"><i class="fa-solid fa-times text-[10px]"></i></button>
                                    </div>
                                </div>
                                <div class="space-y-0.5 mt-0.5 ${isCatCollapsed ? 'hidden' : 'block'} pl-8 border-l-2 border-slate-100 ml-7">
                        `;
                        state.classes.forEach(cls => {
                            const isVisibleCls = cls.isVisible !== false;
                            if (!isVisibleCls && !state.isEditMode) return;
                            const hiddenClassClsInner = !isVisibleCls ? 'opacity-50 grayscale' : '';

                            const isActive = state.currentView === 'category' && state.activeIds.category === cat && state.activeIds.classId === cls.id;
                            html += `
                                <div onclick="switchView('category', '${sec.id}', '${cls.id}', null, '${cat}')" class="flex items-center space-x-2 py-1.5 px-2 rounded-lg cursor-pointer transition ${isActive ? 'font-bold' : 'text-slate-500 hover:text-slate-800'} min-w-0 ${hiddenClassClsInner}" ${isActive ? 'style="background-color: var(--theme-light); color: var(--theme-primary);"' : ''}>
                                    <i class="fa-regular fa-folder text-[9px] text-slate-300 flex-shrink-0"></i>
                                    <span class="text-xs truncate min-w-0">${cls.name}</span>
                                </div>
                            `;
                        });
                        html += `</div></div>`;
                    });
                    html += `<button onclick="addCategory('${sec.id}')" class="edit-controls-flex w-full items-center pl-6 py-2 space-x-2 text-[10px] font-bold text-emerald-600 hover:text-emerald-700 transition"><i class="fa-solid fa-plus"></i><span>Add Category</span></button>`;
                }
                html += `</div></div>`;
            });
            
            html += `<button onclick="addSection()" class="edit-controls-flex w-full items-center justify-center space-x-2 text-xs font-bold text-indigo-600 bg-indigo-50 hover:bg-indigo-100 py-3 mt-6 rounded-xl hide-on-collapse transition border border-indigo-100"><i class="fa-solid fa-plus"></i><span>New Main Section</span></button>`;

            // Contact Menu Link
            if (state.contact.isVisible || state.isEditMode) {
                const hiddenClass = !state.contact.isVisible ? 'opacity-60 grayscale' : '';
                const hideIcon = !state.contact.isVisible ? '<i class="fa-solid fa-eye-slash text-[10px] text-rose-500 edit-controls-block ml-2"></i>' : '';
                const isContactActive = state.currentView === 'contact';
                
                html += `
                    <div class="menu-item mt-3 mb-1 group relative ${hiddenClass}">
                        <div onclick="handleIconClick(event, () => switchView('contact'))" class="flex items-center space-x-3 p-3 rounded-xl cursor-pointer transition ${isContactActive ? activeStyle : inactiveStyle} center-on-collapse">
                            <div class="icon-container w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0 transition-colors ${isContactActive ? iconActiveStyle : iconInactiveStyle}"><i class="fa-solid fa-address-card text-sm"></i></div>
                            <textarea rows="1" data-field="contact.title" class="w-full text-sm font-semibold bg-transparent editable-border p-0 resize-none overflow-hidden cursor-pointer truncate hide-on-collapse" onclick="event.stopPropagation()">${state.contact.title}</textarea>
                            ${hideIcon}
                        </div>
                    </div>
                `;
            }

            nav.innerHTML = html;
        }

        function renderApp() {
            if(state.profile.pic) document.getElementById('sidebar-profile-pic').src = state.profile.pic;
            
            document.querySelectorAll('textarea[data-field="profile.name"]').forEach(el => el.value = state.profile.name);
            document.querySelectorAll('textarea[data-field="profile.grade"]').forEach(el => el.value = state.profile.grade);

            renderSidebarNav();
            renderBreadcrumbs();
            
            const vp = document.getElementById('main-content-viewport');

            vp.classList.remove('fade-in');
            void vp.offsetWidth; 
            vp.classList.add('fade-in');

            let contentHtml = '';
            if (state.currentView === 'about') {
                contentHtml = renderAboutMe();
            } else if (state.currentView === 'section') {
                const sec = state.sections.find(s => s.id === state.activeIds.sectionId);
                contentHtml = renderSectionLanding(sec);
            } else if (state.currentView === 'subject') {
                const cls = state.classes.find(c => c.id === state.activeIds.classId);
                const sub = cls.subjects.find(s => s.id === state.activeIds.subjectId);
                contentHtml = renderSubjectView(cls, sub);
            } else if (state.currentView === 'category') {
                const cat = state.activeIds.category;
                const cls = state.classes.find(c => c.id === state.activeIds.classId);
                contentHtml = renderCommonCategoryView(cat, cls.id);
            } else if (state.currentView === 'contact') {
                contentHtml = renderContact();
            }

            vp.innerHTML = contentHtml + renderGlobalContactFooter();

            attachInputListeners();
            updateEditModeUI();
            
            setTimeout(resizeAllTextareas, 50);
            setTimeout(resizeAllTextareas, 200);
        }

        function renderGlobalContactFooter() {
            if (!state.contact.isVisible && !state.isEditMode) return '';
            if (state.currentView === 'about' || state.currentView === 'contact') return '';
            const hiddenClass = !state.contact.isVisible ? 'opacity-60 grayscale border-dashed' : '';
            const hideIcon = !state.contact.isVisible ? '<i class="fa-solid fa-eye-slash text-rose-500 ml-2 text-xs"></i>' : '';
            
            return `
                <div class="max-w-4xl mx-auto mt-12 mb-4 min-w-0 ${hiddenClass}">
                    <div onclick="event.stopPropagation(); switchView('contact')" class="glass-card rounded-[2rem] p-6 shadow-md hover:shadow-lg transition-all duration-300 bg-white border border-slate-100 flex items-center justify-between cursor-pointer group">
                        <div class="flex items-center space-x-4 min-w-0">
                            <div class="w-12 h-12 rounded-2xl bg-blue-50 flex items-center justify-center shadow-inner group-hover:scale-110 transition-transform flex-shrink-0" style="color: var(--theme-primary);">
                                <i class="fa-solid fa-address-card text-xl"></i>
                            </div>
                            <div class="truncate">
                                <h3 class="font-extrabold text-lg text-slate-800 group-hover:text-[var(--theme-primary)] transition-colors truncate">${state.contact.title}${hideIcon}</h3>
                                <p class="text-xs md:text-sm font-medium text-slate-500 truncate">${state.contact.subtitle}</p>
                            </div>
                        </div>
                        <div class="w-10 h-10 rounded-full bg-slate-50 flex items-center justify-center text-slate-400 group-hover:bg-[var(--theme-primary)] group-hover:text-white transition-colors flex-shrink-0 ml-4">
                            <i class="fa-solid fa-arrow-right"></i>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderContact() {
            return `
                <div class="max-w-5xl mx-auto space-y-8 min-w-0 pb-10">
                    <div class="glass-card p-8 md:p-10 rounded-[2.5rem] shadow-sm relative flex flex-col md:flex-row md:items-center justify-between gap-4" style="background: var(--theme-gradient); color: white;">
                        <div class="flex-1 min-w-0">
                            <textarea rows="1" data-field="contact.title" class="w-full text-4xl md:text-5xl font-extrabold bg-transparent editable-border py-1 resize-none overflow-hidden leading-tight text-white placeholder-white/50">${state.contact.title}</textarea>
                            <textarea rows="1" data-field="contact.subtitle" class="w-full text-lg md:text-xl font-medium mt-2 bg-transparent editable-border py-1 resize-none overflow-hidden text-blue-100 placeholder-white/50">${state.contact.subtitle}</textarea>
                        </div>
                        <button onclick="toggleContactVisibility()" class="edit-controls-flex text-white px-5 py-3 rounded-2xl text-sm font-bold shadow-lg transition-all items-center space-x-2 flex-shrink-0 bg-black/20 hover:bg-black/30 backdrop-blur-md">
                            <i class="fa-solid ${state.contact.isVisible ? 'fa-eye' : 'fa-eye-slash'}"></i>
                            <span>${state.contact.isVisible ? 'Page Visible' : 'Page Hidden'}</span>
                        </button>
                    </div>
                    
                    <div class="space-y-4">
                        <div class="flex items-center justify-between px-2">
                            <h3 class="text-xl font-extrabold text-slate-800">Direct Contact</h3>
                            <button onclick="addContactDetail()" class="edit-controls-flex items-center space-x-1.5 text-xs font-bold text-[var(--theme-primary)] hover:bg-[var(--theme-light)] px-3 py-1.5 rounded-lg transition border border-transparent hover:border-[var(--theme-border)]"><i class="fa-solid fa-plus"></i><span>Add Detail</span></button>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            ${state.contact.details.map((detail, idx) => {
                                let linkHref = getContactLink(detail.value);
                                return `
                                <div class="glass-card rounded-[2rem] p-6 shadow-sm bg-white border border-slate-100 relative group ${!detail.isVisible ? 'edit-mode-hidden-item' : ''}" style="${!detail.isVisible && !state.isEditMode ? 'display:none;' : ''}">
                                    <div class="edit-controls-flex absolute top-4 right-4 space-x-2 z-10">
                                        <button onclick="toggleContactItem('details', ${idx})" class="text-slate-400 hover:text-slate-600 bg-slate-50 p-2 rounded-xl transition" title="Toggle Visibility">
                                            <i class="fa-solid ${detail.isVisible ? 'fa-eye' : 'fa-eye-slash'} text-[10px]"></i>
                                        </button>
                                        <button onclick="removeContactItem('details', ${idx})" class="text-rose-400 hover:text-rose-600 bg-rose-50 p-2 rounded-xl transition" title="Delete Field">
                                            <i class="fa-solid fa-trash text-[10px]"></i>
                                        </button>
                                    </div>
                                    
                                    <div class="flex items-start space-x-4">
                                        <div class="w-12 h-12 rounded-2xl bg-blue-50 flex items-center justify-center flex-shrink-0 relative ${state.isEditMode ? 'cursor-pointer hover:shadow-md transition-shadow' : ''}" style="color: var(--theme-primary);" title="${state.isEditMode ? 'Change Icon' : ''}" ${state.isEditMode ? `onclick="event.stopPropagation(); openIconPicker('contactDetail', ${idx})"` : ''}>
                                            <i class="${getIconClass(detail.icon, 'fa-solid')} text-xl"></i>
                                            ${state.isEditMode ? `<div class="absolute -top-1 -right-1 bg-white text-[var(--theme-primary)] rounded-full w-5 h-5 flex items-center justify-center text-[9px] shadow-sm border border-slate-100"><i class="fa-solid fa-pen"></i></div>` : ''}
                                        </div>
                                        <div class="flex-1 min-w-0 pr-16">
                                            <textarea rows="1" data-field="contactDetail.label" data-ids="${idx}" class="w-full text-xs font-bold text-slate-400 uppercase tracking-wider bg-transparent editable-border p-0 resize-none overflow-hidden">${detail.label}</textarea>
                                            
                                            ${state.isEditMode ? 
                                                `<textarea rows="2" data-field="contactDetail.value" data-ids="${idx}" class="w-full text-base font-semibold text-slate-800 bg-transparent editable-border py-1 mt-1 resize-none overflow-hidden leading-snug">${detail.value}</textarea>` : 
                                                (linkHref ? `<a href="${linkHref}" target="_blank" class="block w-full text-base font-semibold text-[var(--theme-primary)] hover:underline py-1 mt-1 leading-snug break-words transition-colors">${detail.value}</a>` : `<div class="w-full text-base font-semibold text-slate-800 py-1 mt-1 leading-snug break-words">${detail.value}</div>`)
                                            }
                                        </div>
                                    </div>
                                </div>
                            `}).join('')}
                        </div>
                    </div>

                    <div class="space-y-4 pt-6">
                        <div class="flex items-center justify-between px-2">
                            <h3 class="text-xl font-extrabold text-slate-800">Connect Online</h3>
                            <button onclick="addContactSocial()" class="edit-controls-flex items-center space-x-1.5 text-xs font-bold text-[var(--theme-primary)] hover:bg-[var(--theme-light)] px-3 py-1.5 rounded-lg transition border border-transparent hover:border-[var(--theme-border)]"><i class="fa-solid fa-plus"></i><span>Add Social Link</span></button>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                            ${state.contact.socials.map((social, idx) => `
                                <div class="glass-card rounded-[1.5rem] p-5 shadow-sm bg-white border border-slate-100 relative group flex flex-col items-center text-center ${!social.isVisible ? 'edit-mode-hidden-item' : ''}" style="${!social.isVisible && !state.isEditMode ? 'display:none;' : ''}">

        function renderCarousel(mediaArr, context, inputId) {

            const safeImages = JSON.stringify(mediaArr).replace(/"/g, "&quot;");
            
            let mediaDisplayHtml = '';

                mediaDisplayHtml = `<iframe class="absolute inset-0 w-full h-full object-cover" src="${currentItem.url}" frameborder="0" allowfullscreen></iframe>`;

                    <div class="absolute inset-0 w-full h-full flex items-center justify-center overflow-hidden bg-slate-900 cursor-pointer" onclick="openModal('${context}', ${currentIdx})">

            return `
                <div class="carousel-container relative w-full h-full min-h-[300px] md:min-h-full group rounded-t-[2.5rem] md:rounded-l-[2.5rem] md:rounded-tr-none overflow-hidden bg-slate-900" data-context="${context}" data-images="${safeImages}" data-index="${currentIdx}" data-input="${inputId}">
                    ${mediaDisplayHtml}
                    <div class="absolute inset-0 bg-gradient-to-t from-black/50 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 pointer-events-none"></div>
                    
                    <div class="edit-controls-flex absolute top-4 right-4 space-x-2 z-10">

                        <button onclick="removeMedia('${context}')" class="bg-white text-rose-500 w-10 h-10 rounded-xl shadow-lg flex items-center justify-center hover:scale-105 transition" title="Remove"><i class="fa-solid fa-trash text-sm"></i></button>
                    </div>
                    
                    ${mediaArr.length > 1 ? `
                        <button onclick="event.stopPropagation(); manualChangeSlide('${context}', -1)" class="absolute left-4 top-1/2 -translate-y-1/2 bg-black/40 text-white w-10 h-10 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition backdrop-blur-md hover:bg-black/60 z-10"><i class="fa-solid fa-chevron-left text-sm"></i></button>
                        <button onclick="event.stopPropagation(); manualChangeSlide('${context}', 1)" class="absolute right-4 top-1/2 -translate-y-1/2 bg-black/40 text-white w-10 h-10 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition backdrop-blur-md hover:bg-black/60 z-10"><i class="fa-solid fa-chevron-right text-sm"></i></button>

        function openModal(context, index) {
            if (state.isEditMode) return;
            state.modalContext = context;
            state.modalIndex = index;
            renderModal();
            const modal = document.getElementById('media-modal');
            modal.classList.remove('hidden');
            void modal.offsetWidth; 
            modal.classList.remove('opacity-0');
        }

        function closeModal() {
            const modal = document.getElementById('media-modal');
            modal.classList.add('opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
                document.getElementById('modal-content').innerHTML = '';
            }, 300);
        }

        function renderModal() {
            const container = document.querySelector(`[data-context="${state.modalContext}"]`);
            if(!container) return;
            
            const images = JSON.parse(container.getAttribute('data-images').replace(/&quot;/g, '"'));
            const currentItem = images[state.modalIndex];
            const content = document.getElementById('modal-content');
            
            if (typeof currentItem === 'object' && currentItem.type === 'video') {
                content.innerHTML = `<iframe class="w-full h-full aspect-video rounded-2xl shadow-2xl" src="${currentItem.url}" frameborder="0" allowfullscreen></iframe>`;
            } else {
                const imgSrc = typeof currentItem === 'string' ? currentItem : currentItem.url;
                content.innerHTML = `<img src="${imgSrc}" class="max-w-full max-h-full object-contain rounded-xl shadow-2xl protected-media transition-opacity duration-300" oncontextmenu="return false;" ondragstart="return false;">`;
            }
        }

        function modalChangeSlide(dir) {
            const container = document.querySelector(`[data-context="${state.modalContext}"]`);
            if(!container) return;
            const images = JSON.parse(container.getAttribute('data-images').replace(/&quot;/g, '"'));
            
            state.modalIndex = (state.modalIndex + dir + images.length) % images.length;
            renderModal();
        }

        setInterval(() => {
            if(state.isEditMode) return;
            document.querySelectorAll('.carousel-container').forEach(container => {
                try {
                    const imagesStr = container.getAttribute('data-images');
                    if(!imagesStr) return;
                    
                    const images = JSON.parse(imagesStr.replace(/&quot;/g, '"'));
                    if (images.length > 1) {
                        let idx = parseInt(container.getAttribute('data-index'));
                        idx = (idx + 1) % images.length;
                        
                        container.setAttribute('data-index', idx);
                        const currentItem = images[idx];
                        const inputId = container.getAttribute('data-input') || 'temp_input';
                        const context = container.getAttribute('data-context');
                        
                        if (typeof currentItem === 'object' && currentItem.type === 'video') {
                            container.outerHTML = renderCarousel(images, context, inputId);
                        } else {
                            const imgEl = container.querySelector('.carousel-img');
                            if(imgEl) {
                                imgEl.style.opacity = '0.7';
                                setTimeout(() => {
                                    imgEl.src = typeof currentItem === 'string' ? currentItem : currentItem.url;
                                    imgEl.style.opacity = '1';
                                    
                                    const blurBg = container.querySelector('.bg-cover');
                                    if(blurBg) blurBg.style.backgroundImage = `url('${imgEl.src}')`;
                                    
                                    // Update parent click handler to new index
                                    imgEl.parentElement.setAttribute('onclick', `openModal('${context}', ${idx})`);
                                }, 150);
                            } else {
                                container.outerHTML = renderCarousel(images, context, inputId);
                            }
                        }
                        
                        const dots = container.querySelectorAll('.carousel-dot');
                        dots.forEach((dot, i) => {
                            dot.className = `carousel-dot w-2 h-2 rounded-full transition-all duration-300 ${i === idx ? 'bg-white scale-125' : 'bg-white/40'}`;
                        });
                        
                        state[`idx_${context}`] = idx;
                    }
                } catch(e) {}
            });
        }, 5000);

        function manualChangeSlide(context, dir) {
            const el = document.querySelector(`[data-context="${context}"]`);
            if(!el) return;
            const images = JSON.parse(el.getAttribute('data-images').replace(/&quot;/g, '"'));
            const inputId = el.getAttribute('data-input') || 'temp_input';
            
            let curr = state[`idx_${context}`] || 0;
            curr = (curr + dir + images.length) % images.length;
            state[`idx_${context}`] = curr;
            
            el.outerHTML = renderCarousel(images, context, inputId);
        }

        function removeMedia(context) {
            const idx = state[`idx_${context}`] || 0;
            if (context === 'about.media') {
                state.about.media.splice(idx, 1);
                state['idx_about.media'] = 0;
            } else if (context.startsWith('project.')) {
                const parts = context.replace('project.', '').split('|');
                const classId = parts[0];
                const subjectId = parts[1];
                const pIdx = parseInt(parts[2]);
                
                const cls = state.classes.find(c => c.id === classId);
                if (cls) {
                    const sub = cls.subjects.find(s => s.id === subjectId);
                    if (sub && sub.projects && sub.projects[pIdx]) {
                        sub.projects[pIdx].media.splice(idx, 1);
                        state[`idx_${context}`] = 0;
                    }
                }
            } else if (context.startsWith('generic.')) {
                const parts = context.replace('generic.', '').split('|');
                const catId = parts[0];
                const classId = parts[1];
                const pIdx = parseInt(parts[2]);
                
                if (state[catId] && state[catId][classId] && state[catId][classId][pIdx]) {
                    state[catId][classId][pIdx].media.splice(idx, 1);
                    state[`idx_${context}`] = 0;
                }
            }
            triggerSave();
            renderApp();
        }

        function toggleShortcut(e, key) {
            e.stopPropagation();
            const content = document.getElementById('shortcut-content-' + key);
            const icon = document.getElementById('shortcut-icon-' + key);
            if (content.style.maxHeight && content.style.maxHeight !== '0px') {
                content.style.maxHeight = '0px';
                icon.style.transform = 'rotate(0deg)';
                content.style.opacity = '0';
                content.classList.remove('border-slate-100');
                content.classList.add('border-transparent');

                content.style.maxHeight = content.scrollHeight + 'px';

                content.style.opacity = '1';
                content.classList.remove('border-transparent');
                content.classList.add('border-slate-100');
            }

        function toggleShortcutClass(e, key) {
            e.stopPropagation();
            const content = document.getElementById('shortcut-class-content-' + key);
            const icon = document.getElementById('shortcut-class-icon-' + key);
            if (content.style.maxHeight && content.style.maxHeight !== '0px') {
                content.style.maxHeight = '0px';

                content.style.opacity = '0';

        function uploadImageToWeb(file, callback) {
            if (!IMGBB_API_KEY || IMGBB_API_KEY === "PASTE_YOUR_IMGBB_KEY_HERE") {
                showToast("Please add your ImgBB API Key first!");
                return;
            }

            const syncBadge = document.querySelector('header .edit-controls-flex span');
            if(syncBadge) syncBadge.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i><span class="hidden sm:inline">Uploading...</span>`;
            
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = e => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 1200;
                    let width = img.width, height = img.height;
                    if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    const base64Image = canvas.toDataURL('image/jpeg', 0.85).split(',')[1];
                    const formData = new FormData();
                    formData.append('image', base64Image);
                    
                    fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: 'POST', body: formData })
                    .then(res => res.json())
                    .then(data => {
                        if(data.success) {
                            showToast("Image Uploaded!");
                            callback(data.data.url);
                        } else throw new Error("ImgBB API rejected");
                    })
                    .catch(err => {
                        showToast("Upload Failed. Check ImgBB Key.");
                        if(syncBadge) syncBadge.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-rose-500"></i><span class="hidden sm:inline text-rose-500">Failed</span>`;
                    });
                };
            };
        }

        function handleProfilePicUpload(e) {
            if(e.target.files[0]) uploadImageToWeb(e.target.files[0], res => { state.profile.pic = res; triggerSave(); renderApp(); });
        }

        function handleMediaUpload(e, type, arg1, arg2, arg3) {
            const files = Array.from(e.target.files);
            if(files.length === 0) return;
            files.forEach(file => {
                uploadImageToWeb(file, res => {
                    if (type === 'about.media') {
                        state.about.media.push(res);
                    } else if (type === 'project') {
                        const p = state.classes.find(c => c.id === arg1).subjects.find(s => s.id === arg2).projects[arg3];
                        if(!p.media) p.media = [];
                        p.media.push(res);
                    } else if (type === 'generic') {
                        const items = state[arg1][arg2];
                        if(!items[arg3].media) items[arg3].media = [];
                        items[arg3].media.push(res);
                    }
                    triggerSave();
                    renderApp();
                });
            });
        }

        function handleFeedUpload(e, category, classId) {
            Array.from(e.target.files).forEach(file => {
                uploadImageToWeb(file, res => {
                    if(!state[category]) state[category] = {};
                    if(!state[category][classId]) state[category][classId] = [];
                    state[category][classId].unshift({ type: 'img', url: res, desc: '' });
                    triggerSave();
                    renderApp();
                });
            });
        }

        function addAboutVideo() {
            askUser({
                type: 'prompt',
                title: 'Add Video',
                placeholder: 'Paste YouTube URL or Shorts Link',
                onSubmit: (url) => {
                    let embedUrl = url;
                    if(url.includes('watch?v=')) embedUrl = url.replace('watch?v=', 'embed/');
                    else if(url.includes('youtu.be/')) embedUrl = url.replace('youtu.be/', 'youtube.com/embed/');
                    else if(url.includes('shorts/')) embedUrl = url.replace('shorts/', 'embed/');
                    
                    if(!state.about.media) state.about.media = [];
                    state.about.media.push({ type: 'video', url: embedUrl });
                    triggerSave(); 
                    renderApp();
                }
            });
        }

        function addProjectVideo(cId, sId, pIdx) {
            askUser({
                type: 'prompt',
                title: 'Add Project Video',
                placeholder: 'Paste YouTube URL or Shorts Link',
                onSubmit: (url) => {
                    let embedUrl = url;
                    if(url.includes('watch?v=')) embedUrl = url.replace('watch?v=', 'embed/');
                    else if(url.includes('youtu.be/')) embedUrl = url.replace('youtu.be/', 'youtube.com/embed/');
                    else if(url.includes('shorts/')) embedUrl = url.replace('shorts/', 'embed/');

                    const sub = state.classes.find(c => c.id === cId).subjects.find(s => s.id === sId);
                    if(!sub.projects[pIdx].media) sub.projects[pIdx].media = [];
                    
                    sub.projects[pIdx].media.push({ type: 'video', url: embedUrl });
                    triggerSave();
                    renderApp();
                }
            });
        }

        function addGenericVideo(catId, clsId, pIdx) {
            askUser({
                type: 'prompt',
                title: 'Add Item Video',
                placeholder: 'Paste YouTube URL or Shorts Link',
                onSubmit: (url) => {
                    let embedUrl = url;
                    if(url.includes('watch?v=')) embedUrl = url.replace('watch?v=', 'embed/');
                    else if(url.includes('youtu.be/')) embedUrl = url.replace('youtu.be/', 'youtube.com/embed/');
                    else if(url.includes('shorts/')) embedUrl = url.replace('shorts/', 'embed/');

                    const items = state[catId][clsId];
                    if(!items[pIdx].media) items[pIdx].media = [];
                    
                    items[pIdx].media.push({ type: 'video', url: embedUrl });
                    triggerSave();
                    renderApp();
                }
            });
        }

        function addProjectVideoFromCarousel(context) {
            if (context === 'about.media') {
                addAboutVideo();
            } else if (context.startsWith('project.')) {
                const parts = context.replace('project.', '').split('|');
                addProjectVideo(parts[0], parts[1], parseInt(parts[2]));
            } else if (context.startsWith('generic.')) {
                const parts = context.replace('generic.', '').split('|');
                addGenericVideo(parts[0], parts[1], parseInt(parts[2]));
            }
        }

        function addFeedVideo(category, classId) {
            askUser({
                type: 'prompt',
                title: 'Add Feed Video',
                placeholder: 'Paste YouTube URL or Shorts Link',
                onSubmit: (url) => {
                    let embedUrl = url;
                    if(url.includes('watch?v=')) embedUrl = url.replace('watch?v=', 'embed/');
                    else if(url.includes('youtu.be/')) embedUrl = url.replace('youtu.be/', 'youtube.com/embed/');
                    else if(url.includes('shorts/')) embedUrl = url.replace('shorts/', 'embed/');
                    
                    if(!state[category]) state[category] = {};
                    if(!state[category][classId]) state[category][classId] = [];
                    state[category][classId].unshift({ type: 'video', url: embedUrl, desc: '' });
                    triggerSave();
                    renderApp();
                }
            });
        }

        function addSection() {
            askUser({
                type: 'prompt',
                title: 'New Main Section',
                placeholder: "e.g., 'Certificates', 'Travel'",
                onSubmit: (name) => {
                    const newId = 'sec_' + Date.now();
                    state.sections.push({ id: newId, title: name, isAcademic: false, categories: [], isVisible: true });
                    
                    state.collapsedMenus.sections[newId] = false;
                    if (state.sections.length > 0 && !state.sections[state.sections.length-1].isAcademic && state.sections[state.sections.length-1].categories) {
                         state.sections[state.sections.length-1].categories.forEach(cat => state.collapsedMenus.categories[cat] = false);
                    }

                    triggerSave(); renderApp();
                    showToast("New Main Section Added!");
                }
            });
        }

        function removeSection(e, secId) {
            e.stopPropagation();
            askUser({
                title: 'Delete this entire section?',
                submitText: 'Delete',
                onSubmit: () => {
                    state.sections = state.sections.filter(s => s.id !== secId);
                    triggerSave(); renderApp();
                    showToast("Section removed");
                }
            });
        }

        function addCategory(secId) {
            askUser({
                type: 'prompt',
                title: 'New Category',
                placeholder: "e.g., 'Robotics Club'",
                onSubmit: (name) => {
                    const newCatId = 'cat_' + Date.now();
                    state.categoryNames[newCatId] = name;
                    state[newCatId] = {};
                    state.classes.forEach(cls => state[newCatId][cls.id] = []);
                    if (!state.categoryVisibility) state.categoryVisibility = {};
                    state.categoryVisibility[newCatId] = true;
                    
                    const sec = state.sections.find(s => s.id === secId);
                    if(!sec.categories) sec.categories = [];
                    sec.categories.push(newCatId);

                    state.collapsedMenus.categories[newCatId] = false;
                    triggerSave(); renderApp();
                }
            });
        }

        function removeCategory(e, secId, catId) {
            e.stopPropagation();
            askUser({
                title: 'Remove this category?',
                submitText: 'Remove',
                onSubmit: () => {
                    const sec = state.sections.find(s => s.id === secId);
                    if(sec && sec.categories) sec.categories = sec.categories.filter(c => c !== catId);
                    triggerSave(); renderApp();
                    showToast("Category removed");
                }
            });
        }

        function addClass() {
            askUser({
                type: 'prompt',
                title: 'Add Grade / Class',
                placeholder: "e.g., Grade 7 (2027-28)",
                onSubmit: (name) => {
                    const newId = 'class_' + Date.now();
                    state.classes.unshift({ id: newId, name: name, year: '', isVisible: true, subjects: [] });
                    
                    state.sections.forEach(s => {
                        if(!s.isAcademic && s.categories) {
                            s.categories.forEach(cat => {
                                if (!state[cat]) state[cat] = {};
                                state[cat][newId] = [];
                            });
                        }
                    });
                    
                    state.collapsedMenus.classes[newId] = false;

                    triggerSave(); renderApp();
                    showToast("New Grade Added Successfully!");
                }
            });
        }

        function removeClass(e, classId) {
            e.stopPropagation();
            askUser({
                title: 'Delete this Grade/Class?',
                submitText: 'Delete',
                onSubmit: () => {
                    state.classes = state.classes.filter(c => c.id !== classId);
                    triggerSave(); renderApp();
                    showToast("Grade removed");
                }
            });
        }

        function addSubject(classId) {
            const cls = state.classes.find(c => c.id === classId);
            cls.subjects.push({ id: 'sub_' + Date.now(), name: 'New Subject', description: '', projects: [] });
            triggerSave(); renderApp();
        }

        function removeSubject(e, classId, subjectId) {
            e.stopPropagation();
            askUser({
                title: 'Delete this Subject?',
                submitText: 'Delete',
                onSubmit: () => {
                    const cls = state.classes.find(c => c.id === classId);
                    if(cls) {
                        cls.subjects = cls.subjects.filter(s => s.id !== subjectId);
                        triggerSave(); renderApp();
                        showToast("Subject removed");
                    }
                }
            });
        }

        function addProjectCard(cId, sId) {
            const sub = state.classes.find(c => c.id === cId).subjects.find(s => s.id === sId);
            if(!sub.projects) sub.projects = [];
            sub.projects.unshift({ title: 'New Project', desc: '', media: [] });
            triggerSave(); renderApp();
        }

        function removeProjectCard(cId, sId, idx) {
            askUser({
                title: 'Remove this Project?',
                submitText: 'Remove',
                onSubmit: () => {
                    state.classes.find(c => c.id === cId).subjects.find(s => s.id === sId).projects.splice(idx, 1);
                    triggerSave(); renderApp();
                    showToast("Project removed");
                }
            });
        }

        function addGenericItem(category, classId) {
            if(!state[category]) state[category] = {};
            if(!state[category][classId]) state[category][classId] = [];
            state[category][classId].unshift({ title: 'New Item', desc: '', media: [] });
            triggerSave(); renderApp();
        }

        function removeGenericItem(category, classId, idx) {
            askUser({
                title: 'Remove this item?',
                submitText: 'Remove',
                onSubmit: () => {
                    state[category][classId].splice(idx, 1);
                    triggerSave(); renderApp();
                    showToast("Item removed");
                }
            });
        }
    </script>
</body>
</html>
