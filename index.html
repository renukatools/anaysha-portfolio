    <style>
        :root {
            --theme-primary: #2563eb;
            --theme-hover: #1d4ed8;
            --theme-light: #eff6ff;
            --theme-border: #bfdbfe;
            --theme-gradient: linear-gradient(to right, #2563eb, #4f46e5);
        }

        /* MOBILE FIX: Ensure the body handles dynamic browser bars gracefully */
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            -webkit-tap-highlight-color: transparent; 
            height: 100vh; /* Fallback for older browsers */
            height: 100dvh; /* Modern dynamic viewport height fixes mobile bottom bar jumps */
        }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--theme-border); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--theme-primary); }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

        .edit-controls-flex { display: none !important; }
        .edit-controls-block { display: none !important; }
        body.edit-mode .edit-controls-flex { display: flex !important; }
        body.edit-mode .edit-controls-block { display: block !important; }
        
        body:not(.edit-mode) .editable-border { border: 1px solid transparent !important; pointer-events: none; }
        body.edit-mode .editable-border { border: 1px dashed #94a3b8 !important; border-radius: 0.5rem; transition: all 0.2s; }
        body.edit-mode .editable-border:focus { border-color: var(--theme-primary) !important; background: #f8fafc; outline: none; box-shadow: 0 0 0 3px var(--theme-light); }

        /* FIXED: Only hide empty portfolio data fields, not login inputs! */
        body:not(.edit-mode) textarea[data-field]:placeholder-shown,
        body:not(.edit-mode) input[data-field]:placeholder-shown,
        body:not(.edit-mode) .hide-if-empty:empty,
        body:not(.edit-mode) .hide-if-no-media:not(:has(img)):not(:has(iframe)) { display: none !important; }

        body.edit-mode .edit-mode-hidden-item { opacity: 0.6; filter: grayscale(40%); border: 1px dashed #cbd5e1; }

        /* Media Protection */
        .protected-media { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-user-drag: none; pointer-events: auto; }

        #app-sidebar { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        #app-sidebar.collapsed { width: 5.5rem; }
        #app-sidebar.collapsed .hide-on-collapse { display: none; opacity: 0; }
        #app-sidebar.collapsed .center-on-collapse { justify-content: center; padding-left: 0; padding-right: 0; }
        
        /* Smooth re-centering of toggle button when sidebar collapses */
        #app-sidebar.collapsed #sidebar-toggle-btn { right: 50%; transform: translateX(50%); top: calc(1rem + env(safe-area-inset-top)); }
        #app-sidebar:not(.collapsed) #sidebar-toggle-btn { transform: translateX(0); }
        #app-sidebar.collapsed .profile-pic-container { margin-top: 2.5rem; }
        #app-sidebar:not(.collapsed) .profile-pic-container { margin-top: 0; }
        
        /* Square active block styling for collapsed state */
        #app-sidebar.collapsed .menu-item { justify-content: center !important; padding: 0.75rem !important; aspect-ratio: 1/1 !important; display: flex !important; flex-direction: column !important; align-items: center !important; }
        #app-sidebar.collapsed .menu-item .icon-container { width: 100% !important; height: 100% !important; display: flex !important; align-items: center !important; justify-content: center !important; margin: 0 !important; background: transparent !important; box-shadow: none !important; }
        #app-sidebar.collapsed .menu-item .icon-container i { font-size: 1.25rem !important; }

        @media (max-width: 767px) {
            #app-sidebar { position: absolute; left: 0; top: 0; transform: translateX(-100%); width: 85vw !important; max-width: 320px; z-index: 50; height: 100%; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
            #app-sidebar.mobile-open { transform: translateX(0); }
            #app-sidebar .hide-on-collapse { display: block; opacity: 1; }
            #app-sidebar.collapsed { width: 85vw !important; }
            .mobile-overlay { display: none; position: fixed; inset: 0; background: rgba(15,23,42,0.4); z-index: 40; backdrop-filter: blur(3px); }
            .mobile-overlay.show { display: block; }
        }

        #toast-notification { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s; transform: translateY(100px); opacity: 0; z-index: 99999; }
        #toast-notification.show { transform: translateY(0); opacity: 1; }

        .fade-in { animation: fadeIn 0.4s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .wave-emoji { display: inline-block; animation: wave 2.5s infinite; transform-origin: 70% 70%; }
        @keyframes wave { 0% { transform: rotate( 0.0deg) } 10% { transform: rotate(14.0deg) } 20% { transform: rotate(-8.0deg) } 30% { transform: rotate(14.0deg) } 40% { transform: rotate(-4.0deg) } 50% { transform: rotate(10.0deg) } 60% { transform: rotate( 0.0deg) } 100% { transform: rotate( 0.0deg) } }

        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.5); }
        .tree-line { position: relative; }
        .tree-line::before { content: ''; position: absolute; left: 24px; top: 0; bottom: 0; width: 2px; background: #e2e8f0; border-radius: 2px; z-index: 0; }
        .tree-item { position: relative; z-index: 1; }
        
        /* Multi-link selector checkmark animation */
        .check-anim { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }

        /* CRITICAL BUG FIX: Ensure carousel containers never collapse to 0px height in stacked layouts */
        .carousel-container { min-height: 300px !important; height: 100% !important; }
        @media (min-width: 768px) {
            .carousel-container { min-height: 400px !important; }
        }
    </style>
</head>

            const submitBtn = document.getElementById('action-modal-submit');
            
            title.innerText = options.title || 'Are you sure?';
            
            input1.value = ''; input2.value = '';
            input1.classList.add('hidden'); input2.classList.add('hidden');
            
            if (options.type === 'prompt') {
                input1.classList.remove('hidden');
                input1.placeholder = options.placeholder || 'Enter value...';
                input1.type = 'text';
            } else if (options.type === 'login') {
                input1.classList.remove('hidden');
                input2.classList.remove('hidden');
                input1.placeholder = 'Admin Email';
                input1.type = 'email';
                input2.placeholder = 'Admin Password';
                input2.type = 'password';
            }
            
            submitBtn.innerText = options.submitText || 'Submit';
            
            const handleEnter = (e) => { if (e.key === 'Enter') submitBtn.click(); };
            input1.addEventListener('keypress', handleEnter);
            input2.addEventListener('keypress', handleEnter);

            const cleanup = () => {
                modal.classList.add('opacity-0');
                panel.classList.remove('scale-100');
                panel.classList.add('scale-95');
                setTimeout(() => modal.classList.add('hidden'), 300);
                submitBtn.onclick = null;
                cancelBtn.onclick = null;
                input1.removeEventListener('keypress', handleEnter);
                input2.removeEventListener('keypress', handleEnter);
            };
            
            cancelBtn.onclick = cleanup;
            
            submitBtn.onclick = () => {
                let val1 = input1.value.trim();
                let val2 = input2.value.trim();
                if (options.type === 'prompt' && !val1) return;
                if (options.type === 'login' && (!val1 || !val2)) return;
                
                cleanup();
                if (options.onSubmit) options.onSubmit(val1, val2);
            };
            
            modal.classList.remove('hidden');
            void modal.offsetWidth;
            modal.classList.remove('opacity-0');
            panel.classList.remove('scale-95');
            panel.classList.add('scale-100');
            
            if (options.type === 'prompt' || options.type === 'login') {
                setTimeout(() => input1.focus(), 100);
            }
        }

        function switchView(viewName, mfId = null, sfId = null, topId = null) {
            state.currentView = viewName;
            state.activeIds = { mfId, sfId, topicId: topId };
            if (window.innerWidth < 768) {
                document.getElementById('app-sidebar').classList.remove('mobile-open');
                document.getElementById('mobile-sidebar-overlay').classList.remove('show');
            }
            
            const vp = document.getElementById('main-content-viewport');
            if (vp) {
                vp.classList.remove('scroll-smooth');
                vp.style.scrollBehavior = 'auto';
                vp.scrollTop = 0;
            }
            window.scrollTo(0, 0);

            renderApp();
            
            if (vp) {
                let attempts = 0;
                const scrollInterval = setInterval(() => {
                    vp.scrollTop = 0;
                    window.scrollTo(0, 0);
                    attempts++;
                    if (attempts > 6) {
                        clearInterval(scrollInterval);
                        vp.classList.add('scroll-smooth');
                        vp.style.scrollBehavior = 'smooth';
                    }
                }, 30);
            }
        }

            const mobileLockIcon = document.getElementById('mobile-lock-icon');

        function showToast(msg) {

        function resizeAllTextareas() {
            document.querySelectorAll('textarea[data-field]').forEach(el => {
                el.style.height = 'auto';
                el.style.height = el.scrollHeight + 'px';
            });
        }

        function attachInputListeners() {
            document.querySelectorAll('textarea[data-field], input[data-field]').forEach(input => {
                if(input.tagName === 'TEXTAREA') {
                    input.addEventListener('input', function() { 
                        this.style.height = 'auto';
                        this.style.height = this.scrollHeight + 'px'; 
                    });
                }
                input.addEventListener('input', (e) => {
                    if (!auth.currentUser) return;
                    const field = e.target.dataset.field;
                    const val = e.target.value;
                    const ids = e.target.dataset.ids ? e.target.dataset.ids.split(',') : [];

                    if (field.startsWith('profile.')) state.profile[field.split('.')[1]] = val;
                    else if (field.startsWith('about.')) state.about[field.split('.')[1]] = val;
                    else if (field === 'mf.name') state.mainFolders.find(m => m.id === ids[0]).name = val;
                    else if (field === 'sf.name') state.mainFolders.find(m => m.id === ids[0]).subFolders.find(s => s.id === ids[1]).name = val;
                    else if (field === 'top.name') state.mainFolders.find(m => m.id === ids[0]).subFolders.find(s => s.id === ids[1]).topics.find(t => t.id === ids[2]).name = val;
                    else if (field === 'top.desc') state.mainFolders.find(m => m.id === ids[0]).subFolders.find(s => s.id === ids[1]).topics.find(t => t.id === ids[2]).desc = val;
                    else if (field === 'item.title') state.mainFolders.find(m => m.id === ids[0]).subFolders.find(s => s.id === ids[1]).topics.find(t => t.id === ids[2]).items[ids[3]].title = val;
                    else if (field === 'item.desc') state.mainFolders.find(m => m.id === ids[0]).subFolders.find(s => s.id === ids[1]).topics.find(t => t.id === ids[2]).items[ids[3]].desc = val;
                    
                    else if (field === 'contact.title') state.contact.title = val;
                    else if (field === 'contact.subtitle') state.contact.subtitle = val;
                    else if (field === 'contactDetail.label') state.contact.details[ids[0]].label = val;
                    else if (field === 'contactDetail.value') state.contact.details[ids[0]].value = val;
                    else if (field === 'contactSocial.label') state.contact.socials[ids[0]].label = val;
                    else if (field === 'contactSocial.link') state.contact.socials[ids[0]].link = val;

                    document.querySelectorAll(`[data-sync="${field}_${ids.join('_')}"]`).forEach(el => el.innerText = val);
                    triggerSave();
                });
            });
        }

        function getContactLink(value) {
            if (!value) return '';
            const cleaned = value.trim();
            if (cleaned.toLowerCase().startsWith('http://') || cleaned.toLowerCase().startsWith('https://')) return cleaned;
            if (cleaned.includes('@') && !cleaned.includes(' ')) return `mailto:${cleaned}`;
            if (/^[\+\d\s\-\(\)]+$/.test(cleaned) && cleaned.match(/\d/g)?.length >= 7) return `tel:${cleaned.replace(/[^\d\+]/g, '')}`;
            if (cleaned.toLowerCase().startsWith('www.')) return `https://${cleaned}`;
            return '';
        }

            renderSidebarNav();
            renderBreadcrumbs();
            
            const vp = document.getElementById('main-content-viewport');

            vp.classList.remove('fade-in');
            void vp.offsetWidth; 
            vp.classList.add('fade-in');

            let contentHtml = '';
            
            if (state.currentView === 'about') {
                contentHtml = renderAboutMe();
            } else if (state.currentView === 'mainFolder') {
                const mf = state.mainFolders.find(m => m.id === state.activeIds.mfId);
                if(mf) contentHtml = renderMainFolderLanding(mf);
            } else if (state.currentView === 'subFolder') {
                const mf = state.mainFolders.find(m => m.id === state.activeIds.mfId);
                const sf = mf?.subFolders.find(s => s.id === state.activeIds.sfId);
                if(mf && sf) contentHtml = renderSubFolderLanding(mf, sf);
            } else if (state.currentView === 'topic') {
                const mf = state.mainFolders.find(m => m.id === state.activeIds.mfId);
                const sf = mf?.subFolders.find(s => s.id === state.activeIds.sfId);
                const top = sf?.topics.find(t => t.id === state.activeIds.topicId);
                if(mf && sf && top) contentHtml = renderTopicView(mf, sf, top);
            } else if (state.currentView === 'contact') {
                contentHtml = renderContact();
            }

            vp.innerHTML = contentHtml + renderDynamicFooter(state.currentView, state.activeIds);

            attachInputListeners();
            updateEditModeUI();
            
            setTimeout(resizeAllTextareas, 50);
            setTimeout(resizeAllTextareas, 200);
        }

        // --- PHASE 3: UNLIMITED DYNAMIC FOOTER RENDERER ---
        function renderDynamicFooter(view, activeIds) {
            let pageKey = 'default_footer';
            if (view === 'about') pageKey = 'about';
            else if (view === 'contact') return ''; // No footer on contact page
            else if (view === 'mainFolder') pageKey = `mf_${activeIds.mfId}`;
            else if (view === 'subFolder') pageKey = `sf_${activeIds.sfId}`;
            else if (view === 'topic') pageKey = `top_${activeIds.topicId}`;

            let selectedLinks = (state.customFooters && state.customFooters[pageKey]);
            
            if (selectedLinks === 'none') return '';
            
            // Smart Fallbacks
            if (!selectedLinks || !Array.isArray(selectedLinks) || selectedLinks.length === 0) {
                if (view === 'about') {
                    selectedLinks = [];
                    state.mainFolders.forEach(mf => {
                        if (mf.isVisible !== false || state.isEditMode) {
                            selectedLinks.push(`mf_${mf.id}`);
                        }

                    if (state.contact.isVisible || state.isEditMode) selectedLinks.push('contact');
                } else {
                    selectedLinks = ['contact'];
                }

            let footerGridHtml = '';
            
            selectedLinks.forEach(linkId => {
                if (linkId === 'contact') {
                    const hiddenClass = (!state.contact.isVisible && state.isEditMode) ? 'opacity-60 grayscale border-dashed' : '';

                    footerGridHtml += `

                                    <i class="fa-solid fa-address-card text-2xl md:text-3xl"></i>
                                </div>
                                <div class="flex items-center justify-center space-x-1.5 w-full px-1">
                                    <span class="font-extrabold text-slate-800 text-xs md:text-sm leading-snug break-words text-center">${state.contact.title}</span>
                                </div>
                            </div>
                        </div>
                    `;
                } else if (linkId === 'about') {
                    footerGridHtml += `

                                    <i class="fa-solid fa-user text-2xl md:text-3xl"></i>

                                </div>
                            </div>
                        </div>
                    `;
                } else if (linkId.startsWith('mf_')) {
                    const id = linkId.replace('mf_', '');
                    const mf = state.mainFolders.find(m => m.id === id);
                    if (!mf) return;
                    if (mf.isVisible === false && !state.isEditMode) return;

                    footerGridHtml += `

                                    <i class="${displayIcon} text-2xl md:text-3xl"></i>

                                </div>
                            </div>

                } else if (linkId.startsWith('sf_')) {

                    let targetSf = null;

                    footerGridHtml += `

                    let parentSf = null;
                    let targetTop = null;
                    state.mainFolders.forEach(m => {

                    <i class="fa-solid fa-link"></i><span class="hidden sm:inline">Edit Footer</span>
                </button>
            ` : ``;

            if(footerGridHtml === '' && !state.isEditMode) return '';

            return `
                <div class="max-w-6xl mx-auto mt-12 mb-4 min-w-0 relative">
                    <div class="flex items-center space-x-4 px-2 mb-6">

                        <div class="flex-1 h-px bg-slate-200"></div>
                        ${editFooterBtn}

                    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4 md:gap-6 items-start">
                        ${footerGridHtml}
                        ${(footerGridHtml === '' && state.isEditMode) ? '<div class="col-span-full text-center text-slate-400 text-sm font-bold py-10 border-2 border-dashed border-slate-200 rounded-2xl">Footer Hidden. Click Edit Footer to add links.</div>' : ''}
                    </div>

        }

                                    <div class="edit-controls-flex absolute top-4 right-4 space-x-2 z-10">
                                        <button onclick="toggleContactItem('details', ${idx})" class="text-slate-400 hover:text-slate-600 bg-slate-50 p-2 rounded-xl transition" title="Toggle Visibility">

            triggerSave(); renderApp();

        function toggleContactItem(type, idx) {
            state.contact[type][idx].isVisible = !state.contact[type][idx].isVisible;
            triggerSave(); renderApp();
        }
        
        function removeContactItem(type, idx) {
            askUser({
                title: 'Delete this field?',
                submitText: 'Delete',
                onSubmit: () => {
                    state.contact[type].splice(idx, 1);
                    triggerSave(); renderApp();
                }
            });

            state.contact.details.push({ id: 'detail_' + Date.now(), label: 'New Field', value: 'Value', isVisible: true, icon: 'fa-solid fa-circle-dot' });

                            <div class="flex items-center space-x-3 border-b border-slate-100 pb-6">

            // 4. BENTO BOX

            }

            // 5. TIMELINE
            else if (currentLayout === 'timeline') {
                layoutHtml = `<div class="relative border-l-2 border-blue-200 ml-4 md:ml-32 space-y-12 pl-6 md:pl-10 pb-8">
                    ${items.map((item, idx) => {
                        const cKey = `${mf.id}_${sf.id}_${top.id}_${idx}`;
                        const mediaHtml = renderCarousel(item.media || [], `item.${cKey}`, `item_media_${cKey}`);

                        <div class="relative group">

                                </div>
                                <div class="p-8 flex flex-col justify-center flex-1 space-y-3">
                                    <div class="flex justify-between items-start">
                                        <textarea rows="1" data-field="item.title" data-ids="${mf.id},${sf.id},${top.id},${idx}" class="w-full font-extrabold text-slate-900 text-2xl bg-transparent editable-border resize-none" placeholder="Title">${item.title}</textarea>
                                        <div class="flex items-center space-x-1.5 flex-wrap justify-end gap-y-2">
                                            ${state.isEditMode ? `
                                                <button onclick="moveItem('${mf.id}', '${sf.id}', '${top.id}', ${idx}, -1)" class="text-slate-400 hover:text-[var(--theme-primary)] bg-slate-50 hover:bg-blue-50 p-2.5 rounded-xl transition shadow-sm" ${idx === 0 ? 'disabled style="opacity:0.3; cursor:not-allowed;"' : ''}><i class="fa-solid fa-arrow-up text-sm"></i></button>

                                </div>
                            </div>
                        </div>`}).join('')}
                </div>`;
            }

            // 6. IMMERSIVE HERO
            else if (currentLayout === 'hero') {
                layoutHtml = `<div class="space-y-12">
                    ${items.map((item, idx) => {
                        const cKey = `${mf.id}_${sf.id}_${top.id}_${idx}`;
                        const firstImg = item.media && item.media.length > 0 ? (typeof item.media[0] === 'string' ? item.media[0] : item.media[0].url) : '';
                        const mediaHtml = renderCarousel(item.media || [], `item.${cKey}`, `item_media_${cKey}`);
                        return `
                        <div class="relative rounded-[3rem] overflow-hidden shadow-xl min-h-[500px] flex flex-col justify-end bg-slate-900 text-white p-6 md:p-12 group">

                                <div class="flex justify-between items-start pointer-events-auto">
                                    <textarea rows="1" data-field="item.title" data-ids="${mf.id},${sf.id},${top.id},${idx}" class="w-full font-extrabold text-white text-4xl md:text-5xl bg-transparent editable-border resize-none" placeholder="Title">${item.title}</textarea>
                                    <div class="flex items-center space-x-2 flex-shrink-0">
                                        ${state.isEditMode ? `
                                            <button onclick="moveItem('${mf.id}', '${sf.id}', '${top.id}', ${idx}, -1)" class="bg-white/20 text-white hover:bg-white/40 p-3 rounded-xl transition" ${idx === 0 ? 'disabled style="opacity:0.3; cursor:not-allowed;"' : ''}><i class="fa-solid fa-arrow-up text-sm"></i></button>
                                            <button onclick="moveItem('${mf.id}', '${sf.id}', '${top.id}', ${idx}, 1)" class="bg-white/20 text-white hover:bg-white/40 p-3 rounded-xl transition" ${idx === items.length - 1 ? 'disabled style="opacity:0.3; cursor:not-allowed;"' : ''}><i class="fa-solid fa-arrow-down text-sm"></i></button>
                                        ` : ''}
                                        <button onclick="addItemVideo('${mf.id}', '${sf.id}', '${top.id}', ${idx})" class="edit-controls-flex bg-white/20 text-white hover:bg-rose-500 p-3 rounded-xl transition"><i class="fa-brands fa-youtube text-sm"></i></button>
                                        <button onclick="removeItem('${mf.id}', '${sf.id}', '${top.id}', ${idx})" class="edit-controls-flex bg-white/20 text-white hover:bg-rose-500 p-3 rounded-xl transition"><i class="fa-solid fa-trash text-sm"></i></button>
                                    </div>
                                </div>
                                <textarea rows="4" data-field="item.desc" data-ids="${mf.id},${sf.id},${top.id},${idx}" class="w-full text-lg font-medium text-slate-200 bg-transparent editable-border resize-none hide-if-empty pointer-events-auto drop-shadow-md" placeholder="Description...">${item.desc || ''}</textarea>
                            </div>
                        </div>`}).join('')}
                </div>`;
            }

            // 7. MINIMALIST CARD
            else if (currentLayout === 'minimal') {
                layoutHtml = `<div class="max-w-3xl mx-auto space-y-8">
                    ${items.map((item, idx) => {
                        const cKey = `${mf.id}_${sf.id}_${top.id}_${idx}`;
                        const mediaHtml = renderCarousel(item.media || [], `item.${cKey}`, `item_media_${cKey}`);
                        return `
                        <div class="glass-card rounded-[2.5rem] overflow-hidden shadow-sm bg-white border border-slate-100 p-8 md:p-12 space-y-6">
                            <div class="flex justify-between items-start border-b border-slate-100 pb-6">
                                <textarea rows="1" data-field="item.title" data-ids="${mf.id},${sf.id},${top.id},${idx}" class="w-full font-extrabold text-slate-900 text-3xl bg-transparent editable-border resize-none" placeholder="Title">${item.title}</textarea>
                                <div class="flex items-center space-x-1.5 flex-shrink-0 flex-wrap justify-end">
                                    ${state.isEditMode ? `
                                        <button onclick="moveItem('${mf.id}', '${sf.id}', '${top.id}', ${idx}, -1)" class="text-slate-400 hover:text-[var(--theme-primary)] bg-slate-50 hover:bg-blue-50 p-2.5 rounded-xl transition shadow-sm" ${idx === 0 ? 'disabled style="opacity:0.3; cursor:not-allowed;"' : ''}><i class="fa-solid fa-arrow-up text-sm"></i></button>
                                        <button onclick="moveItem('${mf.id}', '${sf.id}', '${top.id}', ${idx}, 1)" class="text-slate-400 hover:text-[var(--theme-primary)] bg-slate-50 hover:bg-blue-50 p-2.5 rounded-xl transition shadow-sm" ${idx === items.length - 1 ? 'disabled style="opacity:0.3; cursor:not-allowed;"' : ''}><i class="fa-solid fa-arrow-down text-sm"></i></button>
                                    ` : ''}
                                    <button onclick="addItemVideo('${mf.id}', '${sf.id}', '${top.id}', ${idx})" class="edit-controls-flex text-rose-500 bg-rose-50 hover:bg-rose-100 p-2.5 rounded-xl transition"><i class="fa-brands fa-youtube"></i></button>
                                    <button onclick="removeItem('${mf.id}', '${sf.id}', '${top.id}', ${idx})" class="edit-controls-flex text-rose-500 bg-rose-50 hover:bg-rose-100 p-2.5 rounded-xl transition"><i class="fa-solid fa-trash"></i></button>

                            </div>
                            <textarea rows="5" data-field="item.desc" data-ids="${mf.id},${sf.id},${top.id},${idx}" class="w-full text-lg font-medium text-slate-600 bg-transparent editable-border resize-none hide-if-empty leading-relaxed" placeholder="Description...">${item.desc || ''}</textarea>
                            <div class="relative hide-if-no-media bg-slate-50 w-full min-h-[300px] rounded-[1.5rem] overflow-hidden mt-6">
                                ${mediaHtml}
                                <input type="file" id="item_media_${cKey}" class="hidden" accept="image/*" multiple onchange="handleMediaUpload(event, 'item', '${mf.id}', '${sf.id}', '${top.id}', ${idx})">
                            </div>
                        </div>`}).join('')}
                </div>`;
            }

            // 8. PRESENTATION CAROUSEL
            else if (currentLayout === 'carousel') {
                const presKey = `pres_${mf.id}_${sf.id}_${top.id}`;
                let pIdx = state[presKey] || 0;
                if (pIdx >= items.length) pIdx = 0;
                const item = items[pIdx];
                const cKey = `${mf.id}_${sf.id}_${top.id}_${pIdx}`;
                const mediaHtml = renderCarousel(item.media || [], `item.${cKey}`, `item_media_${cKey}`);

                layoutHtml = `
                    <div class="max-w-4xl mx-auto glass-card rounded-[2.5rem] overflow-hidden shadow-lg bg-white border border-slate-100 p-6 md:p-10 space-y-6 relative">
                        <div class="flex items-center justify-between border-b border-slate-100 pb-4">
                            <span class="text-xs font-extrabold uppercase tracking-widest text-[var(--theme-primary)] bg-[var(--theme-light)] px-3 py-1.5 rounded-full">Slide ${pIdx + 1} of ${items.length}</span>

                                <button onclick="changePresentationSlide('${presKey}', -1, ${items.length})" class="w-10 h-10 rounded-xl bg-slate-50 hover:bg-slate-100 text-slate-700 flex items-center justify-center transition border border-slate-200"><i class="fa-solid fa-chevron-left"></i></button>

                            ${mediaHtml}
                            <input type="file" id="item_media_${cKey}" class="hidden" accept="image/*" multiple onchange="handleMediaUpload(event, 'item', '${mf.id}', '${sf.id}', '${top.id}', ${pIdx})">
                        </div>

                        <div class="space-y-4 pt-4">

                                <textarea rows="1" data-field="item.title" data-ids="${mf.id},${sf.id},${top.id},${pIdx}" class="w-full font-extrabold text-slate-900 text-2xl md:text-3xl bg-transparent editable-border resize-none" placeholder="Title">${item.title}</textarea>
                                <div class="flex items-center space-x-1.5 flex-wrap justify-end gap-y-2">
                                    ${state.isEditMode ? `
                                        <button onclick="moveItem('${mf.id}', '${sf.id}', '${top.id}', ${pIdx}, -1)" class="text-slate-400 hover:text-[var(--theme-primary)] bg-slate-50 hover:bg-blue-50 p-2.5 rounded-xl transition shadow-sm" ${pIdx === 0 ? 'disabled style="opacity:0.3; cursor:not-allowed;"' : ''}><i class="fa-solid fa-arrow-up text-sm"></i></button>
                                        <button onclick="moveItem('${mf.id}', '${sf.id}', '${top.id}', ${pIdx}, 1)" class="text-slate-400 hover:text-[var(--theme-primary)] bg-slate-50 hover:bg-blue-50 p-2.5 rounded-xl transition shadow-sm" ${pIdx === items.length - 1 ? 'disabled style="opacity:0.3; cursor:not-allowed;"' : ''}><i class="fa-solid fa-arrow-down text-sm"></i></button>
                                    ` : ''}
                                    <button onclick="addItemVideo('${mf.id}', '${sf.id}', '${top.id}', ${pIdx})" class="edit-controls-flex text-rose-500 bg-rose-50 p-2.5 rounded-xl hover:bg-rose-100 transition"><i class="fa-brands fa-youtube"></i></button>
                                    <button onclick="removeItem('${mf.id}', '${sf.id}', '${top.id}', ${pIdx})" class="edit-controls-flex text-rose-500 bg-rose-50 p-2.5 rounded-xl hover:bg-rose-100 transition"><i class="fa-solid fa-trash"></i></button>
                                </div>
                            </div>
                            <textarea rows="4" data-field="item.desc" data-ids="${mf.id},${sf.id},${top.id},${pIdx}" class="w-full text-base font-medium text-slate-600 bg-transparent editable-border resize-none hide-if-empty" placeholder="Description...">${item.desc || ''}</textarea>
                        </div>
                    </div>
                `;
            }

            return `
                <div class="max-w-6xl mx-auto min-w-0 pb-2">
                    ${headerHtml}
                    ${layoutHtml}
                </div>
            `;
        }

        // Helper for Presentation Carousel Layout
        function changePresentationSlide(key, dir, max) {
            let curr = state[key] || 0;
            curr = (curr + dir + max) % max;
            state[key] = curr;
            renderApp();
        }

        function renderCarousel(mediaArr, context, inputId) {
            if (!mediaArr || mediaArr.length === 0) {
                return `
                    <div class="edit-controls-flex w-full h-full min-h-[250px] border-2 border-dashed rounded-[2rem] md:rounded-l-[2.5rem] md:rounded-tr-none flex-col items-center justify-center bg-slate-50 cursor-pointer hover:bg-slate-100 transition m-4 mx-auto max-w-[90%]" style="border-color: var(--theme-border);" onclick="document.getElementById('${inputId}').click()">
                        <div class="text-center" style="color: var(--theme-primary);"><i class="fa-solid fa-cloud-arrow-up text-4xl mb-3"></i><p class="text-sm font-bold">Upload Media</p></div>
                        <div class="flex space-x-2 mt-4 z-10">
                            <button onclick="event.stopPropagation(); document.getElementById('${inputId}').click()" class="px-4 py-2 text-white rounded-xl text-xs font-bold hover:scale-105 transition shadow-sm" style="background: var(--theme-gradient);">Photo</button>
                            <button onclick="event.stopPropagation(); addProjectVideoFromCarousel('${context}')" class="px-4 py-2 bg-rose-500 text-white rounded-xl text-xs font-bold hover:scale-105 transition shadow-sm"><i class="fa-brands fa-youtube mr-1"></i>Video</button>
                        </div>
                    </div>`;
            }

            const currentIdx = state[`idx_${context}`] || 0;
            const currentItem = mediaArr[currentIdx];
            const safeImages = JSON.stringify(mediaArr).replace(/"/g, "&quot;");
            
            let mediaDisplayHtml = '';
            if (typeof currentItem === 'object' && currentItem.type === 'video') {
                mediaDisplayHtml = `<iframe class="absolute inset-0 w-full h-full object-cover" src="${currentItem.url}" frameborder="0" allowfullscreen></iframe>`;
            } else {
                const imgSrc = typeof currentItem === 'string' ? currentItem : currentItem.url;
                mediaDisplayHtml = `
                    <div class="absolute inset-0 w-full h-full flex items-center justify-center overflow-hidden bg-slate-900 cursor-pointer" onclick="openModal('${context}', ${currentIdx})">
                        <div class="absolute inset-0 bg-cover bg-center blur-2xl opacity-40 scale-125" style="background-image: url('${imgSrc}')"></div>
                        <img src="${imgSrc}" class="carousel-img relative max-w-full max-h-full object-contain z-10 p-3 transition-all duration-700 ease-in-out protected-media" oncontextmenu="return false;" ondragstart="return false;">
                    </div>
                `;
            }

            return `
                <div class="carousel-container relative w-full h-full min-h-[300px] md:min-h-full group rounded-t-[2.5rem] md:rounded-l-[2.5rem] md:rounded-tr-none overflow-hidden bg-slate-900" data-context="${context}" data-images="${safeImages}" data-index="${currentIdx}" data-input="${inputId}">
                    ${mediaDisplayHtml}
                    <div class="absolute inset-0 bg-gradient-to-t from-black/50 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 pointer-events-none"></div>
                    
                    <div class="edit-controls-flex absolute top-4 right-4 space-x-2 z-10">
                        <button onclick="document.getElementById('${inputId}').click()" class="bg-white w-10 h-10 rounded-xl shadow-lg flex items-center justify-center hover:scale-105 transition" style="color: var(--theme-primary);" title="Add Photo"><i class="fa-solid fa-camera text-sm"></i></button>
                        <button onclick="addProjectVideoFromCarousel('${context}')" class="bg-white w-10 h-10 rounded-xl shadow-lg flex items-center justify-center hover:scale-105 transition text-rose-500" title="Add Video"><i class="fa-brands fa-youtube text-sm"></i></button>
                        <button onclick="removeMedia('${context}')" class="bg-white text-rose-500 w-10 h-10 rounded-xl shadow-lg flex items-center justify-center hover:scale-105 transition" title="Remove"><i class="fa-solid fa-trash text-sm"></i></button>
                    </div>
                    
                    ${mediaArr.length > 1 ? `
                        <button onclick="event.stopPropagation(); manualChangeSlide('${context}', -1)" class="absolute left-4 top-1/2 -translate-y-1/2 bg-black/40 text-white w-10 h-10 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition backdrop-blur-md hover:bg-black/60 z-10"><i class="fa-solid fa-chevron-left text-sm"></i></button>
                        <button onclick="event.stopPropagation(); manualChangeSlide('${context}', 1)" class="absolute right-4 top-1/2 -translate-y-1/2 bg-black/40 text-white w-10 h-10 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition backdrop-blur-md hover:bg-black/60 z-10"><i class="fa-solid fa-chevron-right text-sm"></i></button>
                        <div class="carousel-dots absolute bottom-6 left-0 right-0 flex justify-center space-x-2 z-10 pointer-events-none">
                            ${mediaArr.map((_, i) => `<div class="carousel-dot w-2 h-2 rounded-full transition-all duration-300 ${i === currentIdx ? 'bg-white scale-125' : 'bg-white/40'}" data-index="${i}"></div>`).join('')}
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function openModal(context, index) {
            if (state.isEditMode) return;
            state.modalContext = context;
            state.modalIndex = index;
            renderModal();
            const modal = document.getElementById('media-modal');
            modal.classList.remove('hidden');
            void modal.offsetWidth; 
            modal.classList.remove('opacity-0');
        }

        function closeModal() {
            const modal = document.getElementById('media-modal');
            modal.classList.add('opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
                document.getElementById('modal-content').innerHTML = '';
            }, 300);
        }

        function renderModal() {
            const container = document.querySelector(`[data-context="${state.modalContext}"]`);
            if(!container) return;
            
            const images = JSON.parse(container.getAttribute('data-images').replace(/&quot;/g, '"'));
            const currentItem = images[state.modalIndex];
            const content = document.getElementById('modal-content');
            
            if (typeof currentItem === 'object' && currentItem.type === 'video') {
                content.innerHTML = `<iframe class="w-full h-full aspect-video rounded-2xl shadow-2xl" src="${currentItem.url}" frameborder="0" allowfullscreen></iframe>`;
            } else {
                const imgSrc = typeof currentItem === 'string' ? currentItem : currentItem.url;
                content.innerHTML = `<img src="${imgSrc}" class="max-w-full max-h-full object-contain rounded-xl shadow-2xl protected-media transition-opacity duration-300" oncontextmenu="return false;" ondragstart="return false;">`;
            }
        }

        // Global interval variable
        let autoSlideInterval;

        function startAutoSlide() {
            clearInterval(autoSlideInterval);
            if(state.isEditMode) return; 
            
            autoSlideInterval = setInterval(() => {
                document.querySelectorAll('.carousel-container').forEach(container => {
                    try {
                        const imagesStr = container.getAttribute('data-images');
                        if(!imagesStr) return;
                        
                        const images = JSON.parse(imagesStr.replace(/&quot;/g, '"'));
                        if (images.length > 1) {
                            let currentIdx = parseInt(container.getAttribute('data-index'));
                            const activeItem = images[currentIdx];
                            
                            // SMART PAUSE: If the current item is a video, DO NOT auto-slide this carousel
                            if (typeof activeItem === 'object' && activeItem.type === 'video') {
                                return;
                            }
                            
                            let idx = (currentIdx + 1) % images.length;
                            container.setAttribute('data-index', idx);
                            const currentItem = images[idx];
                            const inputId = container.getAttribute('data-input') || 'temp_input';
                            const context = container.getAttribute('data-context');
                            
                            if (typeof currentItem === 'object' && currentItem.type === 'video') {
                                container.outerHTML = renderCarousel(images, context, inputId);
                            } else {
                                const imgEl = container.querySelector('.carousel-img');
                                if(imgEl) {
                                    imgEl.style.opacity = '0.7';
                                    setTimeout(() => {
                                        imgEl.src = typeof currentItem === 'string' ? currentItem : currentItem.url;
                                        imgEl.style.opacity = '1';
                                        
                                        const blurBg = container.querySelector('.bg-cover');
                                        if(blurBg) blurBg.style.backgroundImage = `url('${imgEl.src}')`;
                                        
                                        imgEl.parentElement.setAttribute('onclick', `openModal('${context}', ${idx})`);
                                    }, 150);
                                } else {
                                    container.outerHTML = renderCarousel(images, context, inputId);
                                }
                            }
                            
                            const dots = container.querySelectorAll('.carousel-dot');
                            dots.forEach((dot, i) => {
                                dot.className = `carousel-dot w-2 h-2 rounded-full transition-all duration-300 ${i === idx ? 'bg-white scale-125' : 'bg-white/40'}`;
                            });
                            
                            state[`idx_${context}`] = idx;
                        }
                    } catch(e) {}
                });
            }, 5000);
        }

        startAutoSlide();

        function modalChangeSlide(dir) {
            const container = document.querySelector(`[data-context="${state.modalContext}"]`);
            if(!container) return;
            const images = JSON.parse(container.getAttribute('data-images').replace(/&quot;/g, '"'));
            
            state.modalIndex = (state.modalIndex + dir + images.length) % images.length;
            renderModal();
        }

        function manualChangeSlide(context, dir) {
            startAutoSlide(); // Explicitly restart the timer on manual click
            
            const el = document.querySelector(`[data-context="${context}"]`);
            if(!el) return;
            const images = JSON.parse(el.getAttribute('data-images').replace(/&quot;/g, '"'));
            const inputId = el.getAttribute('data-input') || 'temp_input';
            
            let curr = state[`idx_${context}`] || 0;
            curr = (curr + dir + images.length) % images.length;
            state[`idx_${context}`] = curr;
            
            el.outerHTML = renderCarousel(images, context, inputId);
        }

        function removeMedia(context) {
            const idx = state[`idx_${context}`] || 0;
            if (context === 'about.media') {
                state.about.media.splice(idx, 1);
                state['idx_about.media'] = 0;
            } else if (context.startsWith('item.')) {
                const parts = context.replace('item.', '').split('_');
                const mfId = parts[0] + '_' + parts[1];
                const sfId = parts[2] + '_' + parts[3] + '_' + parts[4];
                const topId = parts.slice(5, -1).join('_');
                const pIdx = parseInt(parts[parts.length - 1]);
                
                const mf = state.mainFolders.find(m => m.id === mfId);
                const sf = mf?.subFolders.find(s => s.id === sfId);
                const top = sf?.topics.find(t => t.id === topId);
                
                if (top && top.items && top.items[pIdx]) {
                    top.items[pIdx].media.splice(idx, 1);
                    state[`idx_${context}`] = 0;
                }
            }
            triggerSave();
            renderApp();
        }

        function moveItem(mfId, sfId, topId, idx, dir) {
            const top = state.mainFolders.find(m => m.id === mfId)?.subFolders.find(s => s.id === sfId)?.topics.find(t => t.id === topId);
            if (!top) return;
            
            const items = top.items;
            const newIdx = idx + dir;
            if (newIdx < 0 || newIdx >= items.length) return;
            
            const temp = items[idx];
            items[idx] = items[newIdx];
            items[newIdx] = temp;
            
            state[`idx_item.${mfId}_${sfId}_${topId}_${idx}`] = 0;
            state[`idx_item.${mfId}_${sfId}_${topId}_${newIdx}`] = 0;
            
            triggerSave(); renderApp();
        }

        function toggleShortcut(e, key) {
            e.stopPropagation();
            const content = document.getElementById('shortcut-content-' + key);
            const icon = document.getElementById('shortcut-icon-' + key);
            if (content.style.maxHeight && content.style.maxHeight !== '0px') {
                content.style.maxHeight = '0px';
                icon.style.transform = 'rotate(0deg)';
                content.style.opacity = '0';
                content.classList.remove('border-slate-100');
                content.classList.add('border-transparent');
            } else {
                content.style.maxHeight = content.scrollHeight + 'px';
                icon.style.transform = 'rotate(180deg)';
                content.style.opacity = '1';
                content.classList.remove('border-transparent');
                content.classList.add('border-slate-100');
            }
        }

        function toggleShortcutClass(e, key) {
            e.stopPropagation();
            const content = document.getElementById('shortcut-class-content-' + key);
            const icon = document.getElementById('shortcut-class-icon-' + key);
            if (content.style.maxHeight && content.style.maxHeight !== '0px') {
                content.style.maxHeight = '0px';
                icon.style.transform = 'rotate(0deg)';
                content.style.opacity = '0';
            } else {
                content.style.maxHeight = content.scrollHeight + 'px';
                icon.style.transform = 'rotate(180deg)';
                content.style.opacity = '1';
                const parentCard = content.closest('[id^="shortcut-content-"]');
                if (parentCard) {
                    parentCard.style.maxHeight = (parentCard.scrollHeight + content.scrollHeight) + 'px';
                }
            }
        }

        function uploadImageToWeb(file, callback) {
            if (!IMGBB_API_KEY || IMGBB_API_KEY === "PASTE_YOUR_IMGBB_KEY_HERE") {
                showToast("Please add your ImgBB API Key first!");
                return;
            }

            const syncBadge = document.querySelector('header .edit-controls-flex span');
            if(syncBadge) syncBadge.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i><span class="hidden sm:inline">Uploading...</span>`;
            
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = e => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 1200;
                    let width = img.width, height = img.height;
                    if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    const base64Image = canvas.toDataURL('image/jpeg', 0.85).split(',')[1];
                    const formData = new FormData();
                    formData.append('image', base64Image);
                    
                    fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: 'POST', body: formData })
                    .then(res => res.json())
                    .then(data => {
                        if(data.success) {
                            showToast("Image Uploaded!");
                            callback(data.data.url);
                        } else throw new Error("ImgBB API rejected");
                    })
                    .catch(err => {
                        showToast("Upload Failed. Check ImgBB Key.");
                        if(syncBadge) syncBadge.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-rose-500"></i><span class="hidden sm:inline text-rose-500">Failed</span>`;
                    });
                };
            };
        }

        function handleProfilePicUpload(e) {
            if(e.target.files[0]) uploadImageToWeb(e.target.files[0], res => { state.profile.pic = res; triggerSave(); renderApp(); });
        }

        function handleMediaUpload(e, type, arg1, arg2, arg3, arg4) {
            const files = Array.from(e.target.files);
            if(files.length === 0) return;
            files.forEach(file => {
                uploadImageToWeb(file, res => {
                    if (type === 'about.media') {
                        state.about.media.push(res);
                    } else if (type === 'item') {
                        const top = state.mainFolders.find(m => m.id === arg1)?.subFolders.find(s => s.id === arg2)?.topics.find(t => t.id === arg3);
                        if(top) {
                            if(!top.items[arg4].media) top.items[arg4].media = [];
                            top.items[arg4].media.push(res);
                        }
                    }
                    startAutoSlide(); // Restart timer on upload
                    triggerSave();
                    renderApp();
                });
            });
        }

        function addAboutVideo() {
            askUser({
                type: 'prompt',
                title: 'Add Video',
                placeholder: 'Paste YouTube URL or Shorts Link',
                onSubmit: (url) => {
                    let embedUrl = url;
                    if(url.includes('watch?v=')) embedUrl = url.replace('watch?v=', 'embed/');
                    else if(url.includes('youtu.be/')) embedUrl = url.replace('youtu.be/', 'youtube.com/embed/');
                    else if(url.includes('shorts/')) embedUrl = url.replace('shorts/', 'embed/');
                    
                    if(!state.about.media) state.about.media = [];
                    state.about.media.push({ type: 'video', url: embedUrl });
                    startAutoSlide();
                    triggerSave(); 
                    renderApp();
                }
            });
        }

        function addItemVideo(mfId, sfId, topId, pIdx) {
            askUser({
                type: 'prompt',
                title: 'Add Video',
                placeholder: 'Paste YouTube URL or Shorts Link',
                onSubmit: (url) => {
                    let embedUrl = url;
                    if(url.includes('watch?v=')) embedUrl = url.replace('watch?v=', 'embed/');
                    else if(url.includes('youtu.be/')) embedUrl = url.replace('youtu.be/', 'youtube.com/embed/');
                    else if(url.includes('shorts/')) embedUrl = url.replace('shorts/', 'embed/');

                    const top = state.mainFolders.find(m => m.id === mfId)?.subFolders.find(s => s.id === sfId)?.topics.find(t => t.id === topId);
                    if(top) {
                        if(!top.items[pIdx].media) top.items[pIdx].media = [];
                        top.items[pIdx].media.push({ type: 'video', url: embedUrl });
                        startAutoSlide();
                        triggerSave();
                        renderApp();
                    }
                }
            });
        }

        function addProjectVideoFromCarousel(context) {
            if (context === 'about.media') {
                addAboutVideo();
            } else if (context.startsWith('item.')) {
                const parts = context.replace('item.', '').split('_');
                const mfId = parts[0] + '_' + parts[1];
                const sfId = parts[2] + '_' + parts[3] + '_' + parts[4];
                const topId = parts.slice(5, -1).join('_');
                const pIdx = parseInt(parts[parts.length - 1]);
                addItemVideo(mfId, sfId, topId, pIdx);
            }
        }

        function addMainFolder() {
            askUser({
                type: 'prompt',
                title: 'New Main Folder',
                placeholder: "e.g., 'Grade 8', 'Travel'",
                onSubmit: (name) => {
                    const newId = 'mf_' + Date.now();
                    state.mainFolders.push({ id: newId, name: name, isVisible: true, subFolders: [] });
                    state.collapsedMenus[newId] = false;
                    triggerSave(); renderApp();
                    showToast("New Main Folder Added!");
                }
            });
        }

        function removeMainFolder(e, mfId) {
            e.stopPropagation();
            askUser({
                title: 'Delete this folder and everything inside it?',
                submitText: 'Delete',
                onSubmit: () => {
                    state.mainFolders = state.mainFolders.filter(m => m.id !== mfId);
                    triggerSave(); renderApp();
                    showToast("Folder removed");
                }
            });
        }

        function addSubFolder(mfId) {
            askUser({
                type: 'prompt',
                title: 'New Subcategory',
                placeholder: "e.g., 'Academics', 'Sports'",
                onSubmit: (name) => {
                    const newSfId = 'sf_' + Date.now();
                    const mf = state.mainFolders.find(m => m.id === mfId);
                    if(mf) {
                        if(!mf.subFolders) mf.subFolders = [];
                        mf.subFolders.push({ id: newSfId, name: name, isVisible: true, topics: [] });
                        state.collapsedMenus[newSfId] = false;
                        triggerSave(); renderApp();
                    }
                }
            });
        }

        function removeSubFolder(e, mfId, sfId) {
            e.stopPropagation();
            askUser({
                title: 'Remove this subcategory?',
                submitText: 'Remove',
                onSubmit: () => {
                    const mf = state.mainFolders.find(m => m.id === mfId);
                    if(mf && mf.subFolders) {
                        mf.subFolders = mf.subFolders.filter(s => s.id !== sfId);
                        triggerSave(); renderApp();
                        showToast("Subcategory removed");
                    }
                }
            });
        }

        function addTopic(mfId, sfId) {
            askUser({
                type: 'prompt',
                title: 'New Topic',
                placeholder: "e.g., 'Mathematics', 'Robotics'",
                onSubmit: (name) => {
                    const newTopId = 'top_' + Date.now();
                    const mf = state.mainFolders.find(m => m.id === mfId);
                    const sf = mf?.subFolders.find(s => s.id === sfId);
                    if(sf) {
                        if(!sf.topics) sf.topics = [];
                        sf.topics.push({ id: newTopId, name: name, desc: '', isVisible: true, icon: 'fa-file-lines', items: [] });
                        triggerSave(); renderApp();
                    }
                }
            });
        }

        function removeTopic(e, mfId, sfId, topId) {
            e.stopPropagation();
            askUser({
                title: 'Delete this Topic?',
                submitText: 'Delete',
                onSubmit: () => {
                    const mf = state.mainFolders.find(m => m.id === mfId);
                    const sf = mf?.subFolders.find(s => s.id === sfId);
                    if(sf) {
                        sf.topics = sf.topics.filter(t => t.id !== topId);
                        triggerSave(); renderApp();
                        showToast("Topic removed");
                    }
                }
            });
        }

        function addItem(mfId, sfId, topId) {
            const mf = state.mainFolders.find(m => m.id === mfId);
            const sf = mf?.subFolders.find(s => s.id === sfId);
            const top = sf?.topics.find(t => t.id === topId);
            if(top) {
                if(!top.items) top.items = [];
                top.items.unshift({ title: 'New Item', desc: '', media: [] });
                triggerSave(); renderApp();
            }
        }

        function removeItem(mfId, sfId, topId, idx) {
            askUser({
                title: 'Remove this item?',
                submitText: 'Remove',
                onSubmit: () => {
                    const top = state.mainFolders.find(m => m.id === mfId)?.subFolders.find(s => s.id === sfId)?.topics.find(t => t.id === topId);
                    if(top) {
                        top.items.splice(idx, 1);
                        triggerSave(); renderApp();
                        showToast("Item removed");
                    }
                }
            });
        }
    </script>
